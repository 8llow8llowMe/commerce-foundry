packages:
  - apps/*
  - packages/*

# 공유 의존성 버전은 여기 한 곳에만 적는다. 패키지는 "catalog:" 로 참조한다.
catalog:
  next: 16.4.1
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vitest: 5.0.4
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  # 브랜드 웹폰트 (OFL-1.1). 테마 패키지의 theme.css 가 import 한다
  pretendard: 1.3.9
  '@fontsource/cormorant-garamond': 5.3.0
  '@fontsource/noto-serif-kr': 5.3.1
