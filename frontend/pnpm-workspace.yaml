packages:
  - apps/*
  - packages/*

# 공유 의존성 버전은 여기 한 곳에만 적는다. 패키지는 "catalog:" 로 참조한다.
catalog:
  next: 16.4.2
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vitest: 5.0.4
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  # 브랜드 웹폰트 (OFL-1.1). 테마 패키지의 theme.css 가 import 한다
  pretendard: 1.3.9
  '@fontsource/cormorant-garamond': 5.3.0
  '@fontsource/noto-serif-kr': 5.3.1
  # 상품 상세 HTML(BE 가 정제하지 않은 원문)을 허용 목록으로 거른다
  sanitize-html: 2.18.1
  '@types/sanitize-html': 2.16.2
  # 어드민 메인 전시 섹션 순서 — 드래그 · 키보드 정렬(스크린리더 안내 포함), #71
  '@dnd-kit/core': 6.3.1
  '@dnd-kit/sortable': 10.0.0
  '@dnd-kit/utilities': 3.2.2
  # 어드민 온보딩 투어 — 화면 요소 강조 · 단계 안내(MIT, 의존성 없음), #228
  driver.js: 1.9.0
  # 어드민 OTP 등록 — otpauth URI 를 QR 로 그린다(MIT, 의존성 없음), #417
  uqr: 0.1.3
