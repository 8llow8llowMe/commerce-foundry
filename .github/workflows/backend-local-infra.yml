name: backend-local-infra

# **로컬 미들웨어 compose 가 실제로 뜨는지 확인한다.**
# compose · 스키마 init · .env.example 이 바뀐 PR 에서만 돈다. 깨진 compose 를 다음 사람이 로컬에서 처음 발견하지 않게 한다.
# 비밀번호는 매 실행 무작위로 만든다 — 로컬용 값이라도 저장소에 남기지 않는다.

on:
  pull_request:
    paths:
      - 'backend/docker-compose-local.yml'
      - 'backend/docker/**'
      - 'backend/.env.example'
      - '.github/workflows/backend-local-infra.yml'

permissions:
  contents: read

jobs:
  compose-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 개발자 절차(`.env.example` → `.env` 복사)를 그대로 따르고, compose 가 요구하는 칸만 채운다.
      - name: .env 준비
        run: |
          cp .env.example .env
          sed -i "s/^DB_USERNAME=.*/DB_USERNAME=cf_local/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" .env

      - name: compose up (healthcheck 통과까지 대기)
        run: docker compose -f docker-compose-local.yml up -d --wait --wait-timeout 120

      - name: 서비스별 스키마가 만들어졌는지 확인
        run: |
          actual=$(echo "select string_agg(schema_name, ' ' order by schema_name) from information_schema.schemata where schema_name in ('auth','product','orders','payment','delivery','operations');" \
            | docker compose -f docker-compose-local.yml exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d commerce_foundry -tA')
          echo "schemas: $actual"
          test "$actual" = "auth delivery operations orders payment product"

      - name: Redis 가 비밀번호를 요구하는지 확인
        run: |
          test "$(docker compose -f docker-compose-local.yml exec -T redis sh -c 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping')" = "PONG"
          test "$(docker compose -f docker-compose-local.yml exec -T redis redis-cli ping)" != "PONG"

      # 토픽은 앱이 만들지 않는다 — 스크립트가 만들고, 브로커 자동 생성은 꺼져 있어야 한다 (#310)
      - name: Kafka 토픽 스크립트가 돌고 자동 생성이 꺼져 있는지 확인
        run: |
          sh docker/kafka/create-topics.sh
          docker compose -f docker-compose-local.yml exec -T kafka /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:19092 \
            --describe --entity-type brokers --entity-name 1 --all | grep -q 'auto.create.topics.enable=false'

      # PC 의 서비스가 붙는 HOST 리스너(localhost:KAFKA_PORT)로 메시지가 오가는지 — 광고 주소가 틀리면 여기서 멈춘다
      - name: Kafka HOST 리스너로 메시지가 오가는지 확인
        run: |
          k="docker compose -f docker-compose-local.yml exec -T kafka /opt/kafka/bin"
          $k/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic local-infra-check --partitions 1 --replication-factor 1
          echo "ping" | $k/kafka-console-producer.sh --bootstrap-server localhost:9092 --topic local-infra-check
          test "$($k/kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic local-infra-check --from-beginning --max-messages 1 --timeout-ms 30000)" = "ping"

      - name: compose down
        if: ${{ always() }}
        run: docker compose -f docker-compose-local.yml down -v
