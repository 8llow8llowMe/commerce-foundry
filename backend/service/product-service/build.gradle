dependencies {
    implementation project(':core:common-core')
    implementation project(':core:persistence-core')
    implementation project(':core:security-core')
    implementation project(':core:shared-commerce')
    // 주문 만료 · 취소 이벤트 → 재고 선점 해제 컨슈머 · inbox (#309, order-flow-guide.md §3-5). 이벤트를 내지 않아 outbox · ShedLock 은 두지 않는다
    implementation project(':core:messaging-core')

    // security-core 는 서블릿 · Boot 보안 자동설정을 compileOnly 로만 둔다 — 서블릿 서비스가 직접 선언한다 (security-guide.md §5-3)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${rootProject.ext.springdocVersion}"

    // Q 클래스 생성기. persistence-core 의 annotationProcessor 는 전이되지 않아 엔티티를 가진 모듈마다 선언한다
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${rootProject.ext.querydslVersion}:jpa"

    // Entity ↔ Domain 매퍼 (coding-conventions.md §4). 처리기는 lombok(루트) → lombok-mapstruct-binding → mapstruct-processor 순서다
    implementation "org.mapstruct:mapstruct:${rootProject.ext.mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${rootProject.ext.lombokMapstructBindingVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${rootProject.ext.mapstructVersion}"

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // @WebMvcTest 의 @WithMockUser — 서비스 간 권한(SERVICE_*) 토큰이 아직 없어(#51) 인증 주체를 직접 넣는다
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // 테스트 키 · 토큰 · 인가 스모크(ResourceServerSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:security-core'))
    // 폴백 오류 봉투 스모크(FallbackErrorSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:common-core'))
    // 컨텍스트 로딩 테스트용 (application-test.yml). Docker 없이 로컬·CI 가 같은 결과를 낸다
    testRuntimeOnly 'com.h2database:h2'

    // 리포지토리 테스트 (@DataJpaTest + PostgreSQL 컨테이너). Docker 없는 로컬은 건너뛰고 CI 는 실패한다 (bootstrap-conventions.md)
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // 가짜 inbox 저장소(InMemoryProcessedEventStore) · NoOpTransactionManager — 리스너 단위 테스트가 멱등 처리를 단언한다
    testImplementation testFixtures(project(':core:messaging-core'))
    // 재고 해제 흐름 테스트는 내장 Kafka(KRaft)로 돈다 — Docker 없는 로컬에서도 소비 · 중복 · DLT 를 실제로 본다(operations-service 와 같다)
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

// 주문 만료 · 취소 이벤트의 계약 JSON 정본은 문서다(order-flow-guide.md §3-5) — OrderStockReleaseEventListenerTest 가 그 블록을 읽는다.
// 문서만 바뀌어도 테스트가 빌드 캐시 · up-to-date 로 건너뛰어지지 않게 입력으로 선언한다. 경로는 구성 시점에 File 로 풀어 넘긴다(configuration cache 호환)
def orderFlowContract = rootProject.file('docs/order-flow-guide.md')
tasks.named('test') {
    inputs.file(orderFlowContract).withPropertyName('orderFlowContract').withPathSensitivity(PathSensitivity.RELATIVE)
}
