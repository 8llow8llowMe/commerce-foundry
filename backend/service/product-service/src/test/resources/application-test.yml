# 컨텍스트 로딩 테스트 전용 프로파일. 목적은 "빈 정의가 끝까지 조립되는가" 하나다 — 외부 의존은 끊는다.
#   - DB: H2 인메모리(PostgreSQL 모드). Docker 없이 로컬과 CI 가 같은 결과를 낸다.
#     락 · timestamptz · 인덱스처럼 엔진에 기대는 동작은 여기서 검증되지 않는다 — 리포지토리 테스트는 Testcontainers 로 따로 둔다.
#   - Eureka: 끈다. 등록·조회를 시도하면 CI 에서 연결 오류로 늘어진다.
#   - Kafka: 메시징을 끈다(기본값). 주문 이벤트 컨슈머가 뜨지 않는다 — 흐름 테스트(OrderStockReleaseFlowTest)가 내장 Kafka 로 켠다.
# 값은 전부 테스트 전용이다. 비밀이 아니다.

spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:product-context;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS product
    username: sa
    password:
  jpa:
    hibernate:
      # 엔티티 매핑 오류가 컨텍스트 로딩에서 드러나게 실제로 테이블을 만든다
      ddl-auto: create-drop

eureka:
  client:
    enabled: false

snowflake:
  datacenter-id: 1
  worker-id: 1

# 맞춤 제작 · 룩 플래그를 켠 채로 컨텍스트를 띄운다 — ProductServiceApplicationTests 가 바인딩된 값(true)을 단언한다
store:
  features:
    custom-order: true
    looks: true

# 재고 선점 만료 스케줄러가 컨텍스트를 공유하는 다른 테스트의 데이터를 건드리지 않게 첫 실행을 미룬다 — 빈 · 스케줄 등록은 그대로 검증된다
stock:
  reservation:
    expiry-sweep:
      initial-delay: 24h
