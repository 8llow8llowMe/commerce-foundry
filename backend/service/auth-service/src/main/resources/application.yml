server:
  port: 8081

spring:
  application:
    name: auth-service
  # 값은 환경변수로 받는다 (secret-management.md). local 은 backend/.env 를 읽는다 (application-local.yml)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 운영은 애플리케이션이 스키마를 건드리지 않는다 — DDL 은 사람이 직접 적용한다. local · dev 만 update 로 덮는다
      ddl-auto: none
    properties:
      hibernate:
        # 서비스별 스키마 (service-inventory.md §4). 다른 서비스 스키마를 직접 조회하지 않는다
        default_schema: auth
        query:
          # IN 절 바인드 파라미터 수를 2의 거듭제곱으로 채운다 — 개수마다 다른 SQL 이 생겨 쿼리 계획 · PreparedStatement 캐시가 늘어나지 않게 (coding-conventions.md §9-6)
          in_clause_parameter_padding: true
  web:
    resources:
      # 정적 리소스를 내지 않는다. 켜 두면 Swagger 를 닫아도 /webjars/swagger-ui/** 가 그대로 열린다 (Swagger UI 는 springdoc 이 따로 낸다)
      add-mappings: false
  data:
    redis:
      # refresh 토큰 저장 · 회전(auth:refresh-token · auth:refresh-family)과 로그아웃 차단 목록 쓰기(auth:revoked-access-token)
      # (security-guide.md §2-3 · §7-1). 게이트웨이와 같은 Redis 를 가리켜야 한다. 규칙 · 기동 가드는 coding-conventions.md §9-7
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 1s            # 명령 타임아웃 — 없거나 0 이하면 기동하지 않는다
      connect-timeout: 2s    # 연결 타임아웃 — 없거나 0 이하면 기동하지 않는다

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      # 헬스에 Redis 를 넣지 않는다. Redis 는 인스턴스가 모두 같이 쓰는 의존이라 장애면 모든 인스턴스가 함께 DOWN 이 되고,
      # LB · 오케스트레이터가 auth 를 통째로 빼거나 재시작해 Redis 와 무관한 회원가입 · 내 정보까지 끊긴다. 재시작으로 낫는 장애도 아니다.
      # 토큰 API 는 AUTH_013(503) 응답과 warn 로그로 장애를 드러낸다 (security-guide.md §2-3). DB 는 모든 API 가 쓰므로 그대로 둔다
      enabled: false

snowflake:
  # 인스턴스마다 (datacenter-id, worker-id) 쌍이 달라야 한다. 겹치면 같은 밀리초에 같은 ID 가 나온다.
  # 기본값을 두지 않는다 — 값이 빠진 배포 환경이 0/0 으로 조용히 뜨지 않고 기동에 실패하게. local 은 프로파일 yml 이 덮는다
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID}
  worker-id: ${SNOWFLAKE_WORKER_ID}

security:
  jwt:
    # access 토큰 검증 공개키 — PEM 본문 한 줄 (security-guide.md §5-3 · §6). 비었거나 풀리지 않으면 기동하지 않는다.
    # issuer · audience · clock-skew 는 기본값을 쓴다. 테스트는 security-core 테스트 픽스처가 실행 중 만든 키를 넣는다
    public-key: ${JWT_PUBLIC_KEY}
    # 키 교체 중에만 이전 공개키를 넣는다 (security-guide.md §6-3)
    previous-public-key: ${JWT_PUBLIC_KEY_PREVIOUS:}
    # 토큰 발급 (auth 만, security-guide.md §2 · §5-3). 개인키는 PEM 본문 한 줄이고 JWT_PUBLIC_KEY 와 한 쌍이 아니면 기동하지 않는다.
    # 테스트는 security-core 테스트 픽스처가 실행 중 만든 개인키를 넣는다
    issuance:
      private-key: ${JWT_PRIVATE_KEY}
      access-token-ttl: 30m     # 최대 1시간 — 로그아웃 차단 목록 TTL 이 이 상한에 묶인다
      refresh-token-ttl: 14d    # refresh 토큰 · family 키의 TTL. 회전마다 다시 걸리되 auth.token.refresh-family-max-lifetime 을 넘지 않는다
  # 서비스 간 internal API 의 서비스 토큰 (security-guide.md §9). 수명은 기본값(60초)을 쓴다
  internal:
    # 보내는 토큰의 iss 이자 받는 토큰에 있어야 하는 aud — Eureka 서비스 ID
    service-id: ${spring.application.name}
    # 서비스 5종 공용 HS256 비밀 — base64 32바이트 이상(openssl rand -base64 32). 비었거나 풀리지 않으면 기동하지 않는다.
    # 테스트는 security-core 테스트 픽스처가 실행 중 만든 비밀을 넣는다
    secret: ${INTERNAL_JWT_SECRET}
    # 키 교체 중에만 이전 비밀을 넣는다 (security-guide.md §9 교체 런북)
    previous-secret: ${INTERNAL_JWT_SECRET_PREVIOUS:}

auth:
  agreement:
    # 시행 중인 약관 버전 — 동의 이력(member_agreement.terms_version)에 남는다. 클라이언트가 보내지 않는다.
    # 약관을 고치면 시행일로 올린다. 비었거나 20자를 넘으면 기동하지 않는다(AgreementProperties). 날짜로 읽히지 않게 따옴표로 감싼다
    versions:
      terms-of-service: '2026-10-01'
      privacy-policy: '2026-10-01'
      marketing: '2026-10-01'
  token:
    # 이미 회전한 refresh 토큰이 다시 와도 형제 토큰을 내주는 창 — BFF 의 동시 재발급 · 재시도 (#4 결정 6, FE REISSUE_GRACE_MS 와 같다).
    # 밖이면 재사용 감지로 그 로그인(family)을 모두 폐기한다. 0 이상 2분 이하가 아니면 기동하지 않는다(AuthTokenProperties)
    refresh-reuse-grace: 30s
    # 유예 안에서 한 토큰으로 내줄 수 있는 형제 토큰 수. 넘으면 재사용 감지로 family 를 폐기한다 — 훔친 토큰으로 유예 동안 새 토큰을 마구 받지 못하게.
    # 0 이상 10 이하가 아니면 기동하지 않는다
    refresh-reuse-grace-max-siblings: 3
    # 로그인(family) 하나의 절대 수명 — 최초 로그인 시각부터 잰다 (#67, security-guide.md §2-3). 회전해도 이 시간을 넘겨 이어지지 않고,
    # 넘기면 재발급이 401 AUTH_011(재로그인)이다. 상한이 가까우면 새 refresh 토큰 TTL 을 남은 시간으로 줄인다.
    # 30일 — refresh TTL 14일의 약 두 배로, 자주 쓰는 사용자도 한 달에 한 번은 다시 로그인한다.
    # 0 이하이거나 security.jwt.issuance.refresh-token-ttl 보다 짧으면 기동하지 않는다(AuthTokenProperties · AuthTokenBeansConfig)
    refresh-family-max-lifetime: 30d

swagger:
  # 상대 경로라 문서를 불러온 origin(게이트웨이 또는 서비스 직접)으로 "Try it out" 요청이 간다
  server-url: /

# Swagger 는 기본 닫힘이다. local · dev 프로파일만 연다 — 프로파일이 빠진 배포 환경에서 문서가 열리지 않게.
springdoc:
  # 그룹 없는 기본 문서(/v3/api-docs)는 그룹의 경로 필터를 거치지 않아 /internal/** 까지 담는다. 그룹 문서만 낸다
  enable-default-api-docs: false
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    # 외부 검증 배지(validator.swagger.io)로 문서 주소를 보내지 않는다
    validator-url: none
