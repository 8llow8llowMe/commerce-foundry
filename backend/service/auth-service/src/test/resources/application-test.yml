# 컨텍스트 로딩 테스트 전용 프로파일. 목적은 "빈 정의가 끝까지 조립되는가" 하나다 — 외부 의존은 끊는다.
#   - DB: H2 인메모리(PostgreSQL 모드). Docker 없이 로컬과 CI 가 같은 결과를 낸다.
#     락 · timestamptz · 인덱스처럼 엔진에 기대는 동작은 여기서 검증되지 않는다 — 리포지토리 테스트는 Testcontainers 로 따로 둔다.
#   - Eureka: 끈다. 등록·조회를 시도하면 CI 에서 연결 오류로 늘어진다.
#   - Redis: 기동 가드(RedisStartupGuard)를 통과할 값만 둔다. 컨텍스트 테스트는 Redis 에 붙지 않는다 — 접속은 첫 명령에서야 일어나고,
#     토큰 흐름 테스트는 저장소 포트를 인메모리 스텁으로 바꾼다. Lua · 키 · TTL 은 Testcontainers 테스트(RefreshTokenRedisAdapterTest)가 본다.
# 값은 전부 테스트 전용이다. 비밀이 아니다.

spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:auth-context;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS auth
    username: sa
    password:
  jpa:
    hibernate:
      # 엔티티 매핑 오류가 컨텍스트 로딩에서 드러나게 실제로 테이블을 만든다
      ddl-auto: create-drop
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: auth-test-only
      timeout: 1s
      connect-timeout: 2s

eureka:
  client:
    enabled: false

snowflake:
  datacenter-id: 1
  worker-id: 1

auth:
  login-guard:
    # 켜짐(enabled)은 application.yml 값을 그대로 쓴다 — 운영과 같은 켠 상태에서 키 검증 · 해셔 · 어댑터 빈이 실제로 만들어지는지 확인한다.
    # 키는 application.yml 이 기본값 없이 ${AUTH_LOGIN_GUARD_HASH_KEY} 로 받으므로 여기서 테스트 값을 넣는다.
    # 시도 계수 HMAC 키 — base64("auth-login-guard-test-only-hash-key", 35바이트). 테스트 전용이다. 비밀이 아니다
    hash-key: YXV0aC1sb2dpbi1ndWFyZC10ZXN0LW9ubHktaGFzaC1rZXk=
