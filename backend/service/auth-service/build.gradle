dependencies {
    implementation project(':core:common-core')
    implementation project(':core:persistence-core')
    // refresh 토큰 저장 · 회전과 로그아웃 차단 목록 쓰기 (StringRedisTemplate · 기동 가드)
    implementation project(':core:redis-core')
    implementation project(':core:security-core')
    // 배송지 국가별 규칙의 국내 국가 판정 (ShippingScope.DOMESTIC_COUNTRY_CODE)
    implementation project(':core:shared-commerce')

    // security-core 는 서블릿 · Boot 보안 자동설정을 compileOnly 로만 둔다 — 서블릿 서비스가 직접 선언한다 (security-guide.md §5-3)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${rootProject.ext.springdocVersion}"

    // Q 클래스 생성기. persistence-core 의 annotationProcessor 는 전이되지 않아 엔티티를 가진 모듈마다 선언한다
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${rootProject.ext.querydslVersion}:jpa"

    // Entity ↔ Domain 매퍼 (coding-conventions.md §4). 처리기는 lombok(루트) → lombok-mapstruct-binding → mapstruct-processor 순서다
    implementation "org.mapstruct:mapstruct:${rootProject.ext.mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${rootProject.ext.lombokMapstructBindingVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${rootProject.ext.mapstructVersion}"

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 테스트 키 · 토큰 · 인가 스모크(ResourceServerSmokeTestSupport). 테스트 클래스패스에만 들어간다.
    // 컨트롤러 테스트도 @WithMockUser 대신 픽스처 발급기로 만든 실제 access 토큰을 보낸다 — @AuthenticationPrincipal MemberPrincipal 이 실제로 풀려야 해서다
    testImplementation testFixtures(project(':core:security-core'))
    // 폴백 오류 봉투 스모크(FallbackErrorSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:common-core'))
    // 컨텍스트 로딩 테스트용 (application-test.yml). Docker 없이 로컬·CI 가 같은 결과를 낸다
    testRuntimeOnly 'com.h2database:h2'

    // 리포지토리 테스트 (@DataJpaTest + PostgreSQL 컨테이너). Docker 없는 로컬은 건너뛰고 CI 는 실패한다 (bootstrap-conventions.md)
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}
