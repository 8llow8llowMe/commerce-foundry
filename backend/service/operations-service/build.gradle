dependencies {
    implementation project(':core:common-core')
    implementation project(':core:persistence-core')
    implementation project(':core:storage-core')
    implementation project(':core:security-core')
    // 작업 실행 신호 — outbox · 릴레이 · 컨슈머 재시도 · DLT (#307, architecture-guide.md §10)
    implementation project(':core:messaging-core')
    // Claude API 클라이언트 · 계량 SPI (#215 · #435, bootstrap-conventions.md AI). AI 호출은 이 서비스의 작업 핸들러로 모은다 — 원장 · 월 한도 인터셉터가 여기 있다
    implementation project(':core:ai-core')
    // 단일 실행 락 LockProvider 빈(outbox 릴레이 · 정기 작업 플래너, OperationsServiceBeansConfig). messaging-core 의 의존은 전이되지 않아 여기서 선언한다
    implementation "net.javacrumbs.shedlock:shedlock-core:${rootProject.ext.shedlockVersion}"
    implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc:${rootProject.ext.shedlockVersion}"

    // security-core 는 서블릿 · Boot 보안 자동설정을 compileOnly 로만 둔다 — 서블릿 서비스가 직접 선언한다 (security-guide.md §5-3)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // delivery-service 운영자 온보딩 사실 조회(#357 PR-B2). security-core 는 Feign 을 compileOnly 로만 둔다 — 클라이언트를 가진 서비스가 직접 선언한다
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // 서킷은 adapter/out/client/support 가 직접 감싼다 (coding-conventions.md §10) — spring.cloud.openfeign.circuitbreaker 통합은 켜지 않는다
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${rootProject.ext.springdocVersion}"
    // 외부 쇼핑몰 내보내기 CSV 읽기 — 데이터 이관(migration-guide.md, #19)
    implementation "org.apache.commons:commons-csv:${rootProject.ext.commonsCsvVersion}"

    // Q 클래스 생성기. persistence-core 의 annotationProcessor 는 전이되지 않아 엔티티를 가진 모듈마다 선언한다
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${rootProject.ext.querydslVersion}:jpa"

    // Entity ↔ Domain 매퍼 (coding-conventions.md §4). 처리기는 lombok(루트) → lombok-mapstruct-binding → mapstruct-processor 순서다
    implementation "org.mapstruct:mapstruct:${rootProject.ext.mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${rootProject.ext.lombokMapstructBindingVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${rootProject.ext.mapstructVersion}"

    // 제약 이름 판정(persistence-core ConstraintViolations)이 런타임에 PSQLException 을 본다 — 없으면 제약 위반 때 NoClassDefFoundError
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation "org.wiremock:wiremock-standalone:${rootProject.ext.wiremockVersion}"
    // 테스트 키 · 토큰 · 인가 스모크(ResourceServerSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:security-core'))
    // 폴백 오류 봉투 스모크(FallbackErrorSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:common-core'))
    // 컨텍스트 로딩 테스트용 (application-test.yml). Docker 없이 로컬·CI 가 같은 결과를 낸다
    testRuntimeOnly 'com.h2database:h2'

    // 리포지토리 · 동시성 테스트 (@DataJpaTest · @SpringBootTest + PostgreSQL 컨테이너). Docker 없는 로컬은 건너뛰고 CI 는 실패한다 (bootstrap-conventions.md)
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    // #477 E1: 운영 저장 설정을 바꾸지 않는 테스트 전용 JDBC 계측
    testImplementation 'net.ttddyy:datasource-proxy:1.11.1'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // 가짜 outbox 저장소(InMemoryOutboxStore) — 단위 테스트가 실행 신호 발행을 단언한다
    testImplementation testFixtures(project(':core:messaging-core'))
    // Messages API 루프백 스텁(StubMessagesServer) — 계량 인터셉터 · 원장 흐름 테스트가 실제 API 대신 부른다
    testImplementation testFixtures(project(':core:ai-core'))
    // 작업 흐름 테스트는 내장 Kafka(KRaft)로 돈다 — Docker 없는 로컬에서도 신호 발행 · 소비 · nack · DLT 를 실제로 본다(messaging-core 와 같다)
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

// 테스트 JVM 힙을 작게 둔다 — 같은 PC 에서 여러 세션이 빌드하면 가상 메모리(commit)가 바닥나 테스트 JVM 이 뜨지 못한다(#212 작업 중 실제로 났다).
// 컨텍스트 2~3개(H2) 와 흐름 테스트에 충분한 크기다
tasks.named('test') {
    maxHeapSize = '768m'
    // 성공한 CI는 테스트 artifact를 올리지 않는다. 합성 outbox 실측만 로그에 남겨 결과를 회수한다(#476).
    onOutput { descriptor, event ->
        if (descriptor.className == 'com.commercefoundry.global.messaging.OutboxIndexExplainTest' && event.message.startsWith('OUTBOX_INDEX_')) {
            logger.lifecycle(event.message.stripTrailing())
        }
        if (descriptor.className in [
            'com.commercefoundry.domainlayer.notification.adapter.out.persistence.AnomalyStorageProbeH2Test',
            'com.commercefoundry.domainlayer.notification.adapter.out.persistence.AnomalyStorageProbePostgresTest',
            'com.commercefoundry.domainlayer.notification.adapter.out.persistence.PaymentAnomalyPersistenceH2Test',
            'com.commercefoundry.domainlayer.notification.adapter.out.persistence.PaymentAnomalyPersistencePostgresTest'
        ] && event.message.startsWith('ANOMALY_STORAGE_PROBE ')) {
            logger.lifecycle(event.message.stripTrailing())
        }
    }
}
