dependencies {
    implementation project(':core:common-core')
    implementation project(':core:persistence-core')
    implementation project(':core:security-core')

    // security-core 는 서블릿 · Boot 보안 자동설정을 compileOnly 로만 둔다 — 서블릿 서비스가 직접 선언한다 (security-guide.md §5-3)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${rootProject.ext.springdocVersion}"
    // 외부 쇼핑몰 내보내기 CSV 읽기 — 데이터 이관(migration-guide.md, #19)
    implementation "org.apache.commons:commons-csv:${rootProject.ext.commonsCsvVersion}"

    // Q 클래스 생성기. persistence-core 의 annotationProcessor 는 전이되지 않아 엔티티를 가진 모듈마다 선언한다
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${rootProject.ext.querydslVersion}:jpa"

    // Entity ↔ Domain 매퍼 (coding-conventions.md §4). 처리기는 lombok(루트) → lombok-mapstruct-binding → mapstruct-processor 순서다
    implementation "org.mapstruct:mapstruct:${rootProject.ext.mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${rootProject.ext.lombokMapstructBindingVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${rootProject.ext.mapstructVersion}"

    runtimeOnly 'org.postgresql:postgresql'
    // 제약 위반의 제약 이름을 서버 오류 필드(PSQLException#getServerErrorMessage)에서 읽는다 — 메시지 문구는 lc_messages 로케일을 따라 바뀐다.
    // 컴파일에만 둔다(런타임은 위 runtimeOnly). 테스트는 오류 필드를 꾸며 판정을 본다 (global/persistence/ConstraintViolations)
    compileOnly 'org.postgresql:postgresql'
    testImplementation 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 테스트 키 · 토큰 · 인가 스모크(ResourceServerSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:security-core'))
    // 폴백 오류 봉투 스모크(FallbackErrorSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:common-core'))
    // 컨텍스트 로딩 테스트용 (application-test.yml). Docker 없이 로컬·CI 가 같은 결과를 낸다
    testRuntimeOnly 'com.h2database:h2'

    // 리포지토리 · 동시성 테스트 (@DataJpaTest · @SpringBootTest + PostgreSQL 컨테이너). Docker 없는 로컬은 건너뛰고 CI 는 실패한다 (bootstrap-conventions.md)
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

// 테스트 JVM 힙을 작게 둔다 — 같은 PC 에서 여러 세션이 빌드하면 가상 메모리(commit)가 바닥나 테스트 JVM 이 뜨지 못한다(#212 작업 중 실제로 났다).
// 컨텍스트 2~3개(H2) 와 흐름 테스트에 충분한 크기다
tasks.named('test') {
    maxHeapSize = '768m'
}
