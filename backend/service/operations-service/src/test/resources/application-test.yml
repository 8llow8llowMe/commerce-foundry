# 컨텍스트 로딩 테스트 전용 프로파일. 목적은 "빈 정의가 끝까지 조립되는가" 하나다 — 외부 의존은 끊는다.
#   - DB: H2 인메모리(PostgreSQL 모드). Docker 없이 로컬과 CI 가 같은 결과를 낸다.
#     락 · timestamptz · 인덱스처럼 엔진에 기대는 동작은 여기서 검증되지 않는다 — 리포지토리 테스트는 Testcontainers 로 따로 둔다.
#   - Eureka: 끈다. 등록·조회를 시도하면 CI 에서 연결 오류로 늘어진다.
#   - Kafka: 메시징을 끈다(기본값). 실행 신호는 outbox 에 쌓이기만 한다 — 흐름 테스트(JobWorkerFlowTest)가 내장 Kafka 로 켠다.
# 값은 전부 테스트 전용이다. 비밀이 아니다.

spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:operations-context;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS operations
    username: sa
    password:
  jpa:
    hibernate:
      # 엔티티 매핑 오류가 컨텍스트 로딩에서 드러나게 실제로 테이블을 만든다
      ddl-auto: create-drop

eureka:
  client:
    enabled: false

snowflake:
  datacenter-id: 1
  worker-id: 1

# 작업 엔진을 빠른 값으로 덮는다 — 흐름 테스트가 재시도 · lease · 취소를 몇 초 안에 본다
operations:
  jobs:
    worker:
      redelivery-delay: 200ms
      default-lease: 2s
      heartbeat-interval: 200ms
      default-max-run-duration: 30s
      shutdown-grace: 2s
    lease-sweep:
      initial-delay: 100ms
      fixed-delay: 200ms
    retry:
      base-delay: 50ms
      multiplier: 2
      max-delay: 200ms
      jitter-ratio: 0
  # AI 원장 테스트 값 — 실제 가격표가 아니다. 계산이 눈으로 맞는 단가를 쓴다
  ai:
    budget:
      monthly-usd: "10"
      notify-member-ids: 7
    pricing:
      version: test-1
      models:
        test-small:
          input: "1"
          output: "5"
          cache-write: "1.25"
          cache-read: "0.1"
        test-large:
          input: "5"
          output: "25"
          cache-write: "6.25"
          cache-read: "0.5"
