server:
  port: 8086

spring:
  application:
    name: operations-service
  # 값은 환경변수로 받는다 (secret-management.md). local 은 backend/.env 를 읽는다 (application-local.yml)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 운영은 애플리케이션이 스키마를 건드리지 않는다 — DDL 은 사람이 직접 적용한다. local · dev 만 update 로 덮는다
      ddl-auto: none
    properties:
      hibernate:
        # 서비스별 스키마 (service-inventory.md §4). 다른 서비스 스키마를 직접 조회하지 않는다
        default_schema: operations
        query:
          # IN 절 바인드 파라미터 수를 2의 거듭제곱으로 채운다 — 개수마다 다른 SQL 이 생겨 쿼리 계획 · PreparedStatement 캐시가 늘어나지 않게 (coding-conventions.md §9-6)
          in_clause_parameter_padding: true
  web:
    resources:
      # 정적 리소스를 내지 않는다. 켜 두면 Swagger 를 닫아도 /webjars/swagger-ui/** 가 그대로 열린다 (Swagger UI 는 springdoc 이 따로 낸다)
      add-mappings: false
  cloud:
    openfeign:
      client:
        config:
          # delivery-service 운영자 온보딩 사실 조회 (GET /internal/v1/onboarding-facts/shipping-policy, #357). 기본 read timeout 60초를 그대로 두지 않는다
          # request-interceptors 는 여기(default)에 두지 않는다 — 외부 API 클라이언트에도 실린다 (security-guide.md §9-5)
          default:
            connect-timeout: 2000
            read-timeout: 3000
  # Kafka 접속 (deploy-guide.md §4-4). 주소는 Vault 값이다 — 저장소에 쓰지 않는다. 앱은 토픽을 만들지 않는다
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    admin:
      auto-create: false

# Kafka 메시징 (core/messaging-core/README.md). 꺼져 있으면 실행 신호는 outbox 에 쌓이기만 하고 작업이 실행되지 않는다 — 켜면 쌓인 신호부터 나간다
commerce:
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    namespace: ${KAFKA_NAMESPACE:}
    # 토픽 · 그룹 이름의 서비스 토막 — 토픽 <ns>.operations.job-run, 그룹 <ns>.operations.job-runner (docker/kafka/topics.txt)
    service: operations
    required-topics:
      - operations.job-run
      - operations.job-run.dlt
    outbox:
      relay:
        lock-table: operations.shedlock

# 서비스 간 호출 서킷 (coding-conventions.md §10). adapter/out/client/support 의 *InternalResponseSupport 가 인스턴스 이름으로 감싼다.
# spring.cloud.openfeign.circuitbreaker 통합은 켜지 않는다 — 서킷과 예외 변환을 한 곳(support)에서 한다
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 4xx 는 호출한 쪽(우리)의 요청 · 설정 문제다 — 대상 장애로 세지 않는다. 해석은 support 가 서킷 밖에서 한다
        ignore-exceptions:
          - feign.FeignException$FeignClientException
    instances:
      # 운영자 온보딩 배송 업무 사실 (GET /internal/v1/onboarding-facts/shipping-policy, #357). 열려 있으면 그 업무만 UNAVAILABLE 이고 조회는 200 이다
      delivery-service:
        base-config: default

eureka:
  client:
    # 레지스트리는 HTTP Basic 이다 (#248, security-guide.md §12). 사용자는 eureka 고정, 비밀번호 EUREKA_PASSWORD 는 기본값이 없다.
    # 클라이언트가 URL 의 userinfo 를 Basic 헤더로 바꿔 싣는다 — 비밀번호는 영문 · 숫자 · . _ ~ - 만 (openssl rand -hex 32)
    service-url:
      defaultZone: http://eureka:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:8761/eureka/
    # 기동 때 등록이 실패하면(401 · 연결 불가) 기동을 멈춘다 — 자격 증명이 틀린 채 "등록 안 된 UP" 으로 숨지 않게
    should-enforce-registration-at-init: true
  instance:
    # 컨테이너 호스트 이름(컨테이너 ID)이 아니라 네트워크 IP 로 등록한다 — 게이트웨이 lb:// · Feign 이 이름을 풀지 못하는 일을 막는다 (#249).
    # 배포(dev · prod) 기본값이다. local 은 application-local.yml 이 끈다
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health

snowflake:
  # 인스턴스마다 (datacenter-id, worker-id) 쌍이 달라야 한다. 겹치면 같은 밀리초에 같은 ID 가 나온다.
  # 기본값을 두지 않는다 — 값이 빠진 배포 환경이 0/0 으로 조용히 뜨지 않고 기동에 실패하게. local 은 프로파일 yml 이 덮는다
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID}
  worker-id: ${SNOWFLAKE_WORKER_ID}

# 백그라운드 작업 엔진 (architecture-guide.md §10). 값이 빠지거나 0 · 음수면 기동하지 않는다 (JobProperties)
operations:
  jobs:
    worker:
      # false 면 이 인스턴스는 실행 신호를 받지 않는다(등록만). 다른 인스턴스가 실행한다
      enabled: true
      # 인스턴스 하나에서 동시에 실행하는 작업 수 — 실행 스레드 수와 같고 큐는 두지 않는다
      concurrency: 2
      # 전체 실행 칸이 찼거나 종료 중일 때 신호를 늦춰 다시 받는 간격 (1m 이하) — 그동안 이 인스턴스의 컨슈머가 멈춘다.
      # 종류별 칸만 찬 신호는 이만큼 늦게 다시 낸다(outbox)
      redelivery-delay: 2s
      # 워커가 작업을 쥐는 시간. heartbeat 가 연장하고, 끊기면 이 시간 뒤 만료 판정이 회수한다
      default-lease: 5m
      # lease 의 1/3 이하여야 한다 — 한두 번 놓쳐도 lease 가 남게
      heartbeat-interval: 1m
      # 한 시도의 실행 시간 상한. 넘으면 FAILED(RUN_TIMEOUT, 재시도 없음)로 끝내고 멈춤 신호를 준다
      default-max-run-duration: 30m
      # 종료 때 실행 중인 작업을 기다리는 시간. 넘으면 남은 작업을 QUEUED 로 돌려놓는다
      shutdown-grace: 30s
    # lease 만료 판정 — 모든 인스턴스가 돈다(분산 락 없음). 워커가 죽은 작업을 다시 QUEUED 로 돌리고 실행 신호를 다시 낸다
    lease-sweep:
      initial-delay: 30s
      fixed-delay: 30s
      batch-size: 100
      max-batches-per-run: 10
    retry:
      # 시도 횟수 상한 (첫 실행 포함). 핸들러 옵션이 덮는다
      max-attempts: 3
      # 지연 = min(max-delay, base-delay × multiplier^(n−1)) × (1 ± jitter-ratio) — 30s · 2m · 8m ... 상한 30m
      base-delay: 30s
      multiplier: 4
      max-delay: 30m
      jitter-ratio: 0.2
    result:
      # 결과 JSON 상한 (UTF-8 바이트, 64KiB). 큰 결과는 결과 파일로 낸다
      max-json-bytes: 65536
    # 정기 작업 (#212). ShedLock 으로 인스턴스 하나만 등록한다. 같은 슬롯은 끝난 작업까지 dedup_key 로 막는다
    planner:
      enabled: true
      initial-delay: 1m
      fixed-delay: 1m
      # 등록이 이 시간보다 길면 다른 인스턴스가 이어서 잡을 수 있다. 등록 자체는 짧다
      lock-at-most: 5m
      # 이 기간보다 오래된 슬롯은 등록하지 않는다. 32일은 월 1회를 한 번 놓쳐도 따라간다. 더 오래된 슬롯은 채우지 않는다
      catch-up: 32d
      # 비어 있으면 락을 잡지 않는다. 핸들러가 있는 종류만 넣는다(없으면 기동 실패)
      # 같은 종류 · 주기 · 시각에는 하나만 둔다(payload 만 다른 스케줄은 기동 실패). zone 표기를 바꾸면(Asia/Seoul → +09:00) 직전 슬롯이 한 번 더 등록될 수 있다
      # - type: REPORT_EXPORT
      #   cadence: DAILY
      #   time: "09:00"
      #   zone: Asia/Seoul
      #   payload-json: "{}"
      # WEEKLY 는 day-of-week(MONDAY), MONTHLY 는 day-of-month(1~28)만 더한다
      schedules: []
  # 어드민 알림 센터 (#213). 값이 빠지거나 0 · 음수면 기동하지 않는다 (NotificationProperties)
  notifications:
    # SSE 연결을 붙잡는 시간. 끊기면 클라이언트는 목록 조회로 따라잡고 다시 연다
    stream-timeout: 5m
    # 알림이 없어도 이 간격으로 주석을 보낸다. 게이트웨이 response-timeout(10s) 동안 바이트가 없으면 연결이 끊긴다
    stream-heartbeat: 5s
    retention:
      initial-delay: 1m
      fixed-delay: 1h
      # 이 일수보다 오래된 알림을 지운다
      days: 90
  # 운영자 온보딩 (#357). 서버에 기록할 수 있는 안내 투어 허용 목록 — 순서가 조회 응답 순서다 (OnboardingProperties).
  # key 는 어드민 FE 투어 id(frontend/apps/admin/src/lib/tour/tours.ts)에서 -v1 꼬리를 뗀 것이다. 안내를 바꿔 다시 보여 주려면 version 을 올린다.
  # 비었거나 key 형식(^[a-z][a-z0-9-]{0,63}$) · 중복 · version(1 이상)이 틀리면 기동하지 않는다
  onboarding:
    guides:
      - key: console
        version: 1
      - key: stocks
        version: 1
      - key: stock-detail
        version: 1
      - key: size-charts
        version: 1
      - key: size-chart-editor
        version: 1
      - key: size-chart-templates
        version: 1
      - key: shipping-domestic
        version: 1
  # AI 사용량 원장 · 월 한도 (#215 PR-B, bootstrap-conventions.md AI). 블록이 빠지거나 값이 틀리면 기동하지 않는다 (AiUsageProperties).
  # 금액 · 단가는 문자열로 적는다 — double 로 읽지 않는다. 비용은 micro-USD(1 USD = 1,000,000)로 쌓는다
  ai:
    budget:
      # 월 한도 (USD, 소수 6자리까지). 비밀이 아니다 — 배포 설정의 환경변수로 넣는다. 비면 예약이 실패한다(AI 를 켤 때 함께 넣는다)
      monthly-usd: ${AI_MONTHLY_BUDGET_USD:}
      # 월 경계 시간대 — 한국 시각 1일 00:00 에 새 달이 시작한다
      zone: Asia/Seoul
      # 예약 누계가 한도 × 이 비율 이상이 되면 달마다 한 번 경고한다 (0 초과 1 미만)
      warn-ratio: "0.8"
      # 경고 · 초과 알림을 받을 어드민 member id (쉼표 구분, 비밀 아님). 비면 로그 · 지표만 남긴다
      notify-member-ids: ${AI_BUDGET_NOTIFY_MEMBER_IDS:}
    estimate:
      # 예상 입력 토큰 = ceil(마스킹 뒤 글자 수 / chars-per-token) + 이미지 장수 × tokens-per-image. 최대 출력 토큰은 전부 출력 단가로 잡는다
      chars-per-token: 2
      tokens-per-image: 1600
    pricing:
      # 단가표 버전 (20자 이하) — 호출 행에 남아 어느 가격표로 계산했는지 추적한다. 단가를 바꾸면 올린다. 단가가 있으면 필수
      version: ""
      # 모델 ID → 단가 (USD / 1M 토큰, 문자열). 설정 밖 모델은 항목별 최고 단가로 계산한다(MAX_FALLBACK).
      # 공식 가격표 값은 ai-core 연결(PR-B3)에서 채운다. 비어 있으면 예약이 실패한다.
      # 모델 ID 는 대괄호 키로 적는다 — 그래야 점 · 대소문자가 바뀌지 않고 그대로 맵 키가 된다
      #   "[claude-example-1-0]":
      #     input: "..."
      #     output: "..."
      #     cache-write: "..."
      #     cache-read: "..."
      models: {}
    reservation-sweep:
      # 예약 뒤 이 시간이 지나도 결과가 없으면 회수한다(ABANDONED, 예상치를 비용으로 남김). AI 호출 타임아웃 × 재시도보다 넉넉히
      stale-after: 15m
      batch-size: 100
    retention:
      # 호출 시각이 이 일수보다 오래된 호출 행을 지운다. 월 카운터는 지우지 않는다
      days: 400
      batch-size: 500
      max-batches-per-run: 20

security:
  jwt:
    # access 토큰 검증 공개키 — PEM 본문 한 줄 (security-guide.md §5-3 · §6). 비었거나 풀리지 않으면 기동하지 않는다.
    # issuer · audience · clock-skew 는 기본값을 쓴다. 테스트는 security-core 테스트 픽스처가 실행 중 만든 키를 넣는다
    public-key: ${JWT_PUBLIC_KEY}
    # 키 교체 중에만 이전 공개키를 넣는다 (security-guide.md §6-3)
    previous-public-key: ${JWT_PUBLIC_KEY_PREVIOUS:}
  # 서비스 간 internal API 의 서비스 토큰 (security-guide.md §9). 수명은 기본값(60초)을 쓴다
  internal:
    # 보내는 토큰의 iss 이자 받는 토큰에 있어야 하는 aud — Eureka 서비스 ID
    service-id: ${spring.application.name}
    # 서비스 전부가 같이 쓰는 HS256 비밀 — base64 32바이트 이상(openssl rand -base64 32). 비었거나 풀리지 않으면 기동하지 않는다.
    # 테스트는 security-core 테스트 픽스처가 실행 중 만든 비밀을 넣는다
    secret: ${INTERNAL_JWT_SECRET}
    # 키 교체 중에만 이전 비밀을 넣는다 (security-guide.md §9 교체 런북)
    previous-secret: ${INTERNAL_JWT_SECRET_PREVIOUS:}

swagger:
  # 상대 경로라 문서를 불러온 origin(게이트웨이 또는 서비스 직접)으로 "Try it out" 요청이 간다
  server-url: /

# Swagger 는 기본 닫힘이다. local · dev 프로파일만 연다 — 프로파일이 빠진 배포 환경에서 문서가 열리지 않게.
springdoc:
  # 그룹 없는 기본 문서(/v3/api-docs)는 그룹의 경로 필터를 거치지 않아 /internal/** 까지 담는다. 그룹 문서만 낸다
  enable-default-api-docs: false
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    # 외부 검증 배지(validator.swagger.io)로 문서 주소를 보내지 않는다
    validator-url: none

logging:
  level:
    # Eureka 에 닿지 않으면 이 데코레이터가 INFO · WARN 로그에 defaultZone 원문(비밀번호 포함)을 남긴다 (#248, security-guide.md §12-3).
    # 연결 실패 신호는 RetryableEurekaHttpClient 의 WARN 이 남긴다. com.netflix.discovery 를 DEBUG 로 올리지 않는다 — 같은 이유로 비밀번호가 나온다
    com.netflix.discovery.shared.transport.decorator.RedirectingEurekaHttpClient: ERROR
    # kafka-clients 의 "*Config values" INFO 로그에 접속 주소가 찍힌다 (messaging-core README)
    org.apache.kafka.clients.producer.ProducerConfig: WARN
    org.apache.kafka.clients.consumer.ConsumerConfig: WARN
    org.apache.kafka.clients.admin.AdminClientConfig: WARN
