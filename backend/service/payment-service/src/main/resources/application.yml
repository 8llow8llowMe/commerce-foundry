server:
  port: 8084

spring:
  application:
    name: payment-service
  # 값은 환경변수로 받는다 (secret-management.md). local 은 backend/.env 를 읽는다 (application-local.yml)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 운영은 애플리케이션이 스키마를 건드리지 않는다 — DDL 은 사람이 직접 적용한다. local · dev 만 update 로 덮는다
      ddl-auto: none
    properties:
      hibernate:
        # 서비스별 스키마 (service-inventory.md §4). 다른 서비스 스키마를 직접 조회하지 않는다
        default_schema: payment
        query:
          # IN 절 바인드 파라미터 수를 2의 거듭제곱으로 채운다 — 개수마다 다른 SQL 이 생겨 쿼리 계획 · PreparedStatement 캐시가 늘어나지 않게 (coding-conventions.md §9-6)
          in_clause_parameter_padding: true
  web:
    resources:
      # 정적 리소스를 내지 않는다. 켜 두면 Swagger 를 닫아도 /webjars/swagger-ui/** 가 그대로 열린다 (Swagger UI 는 springdoc 이 따로 낸다)
      add-mappings: false
  # Kafka 접속 (deploy-guide.md §4-4). 주소는 Vault 값이다 — 저장소에 쓰지 않는다. 앱은 토픽을 만들지 않는다
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    admin:
      auto-create: false
  cloud:
    openfeign:
      client:
        config:
          # 모든 Feign 클라이언트의 기본 타임아웃 (ms) — 지금은 internal 클라이언트(order-service 주문 요약)가 쓴다. 기본 read timeout 60초를 그대로 두지 않는다.
          # request-interceptors · logger-level 은 여기(default)에 두지 않는다 — 외부 API(토스) 클라이언트에도 실린다 (security-guide.md §9-5, TossPaymentsStartupGuard)
          default:
            connect-timeout: 2000
            read-timeout: 3000
          # 토스페이먼츠 클라이언트(TossPaymentsClient)만의 타임아웃 (ms). 기본 read timeout 60초를 그대로 두지 않는다 (coding-conventions.md §10, architecture-guide.md §8).
          # read 는 게이트웨이 응답 타임아웃(10s)보다 짧아야 한다 — 게이트웨이가 먼저 끊으면 고객은 실패를 보는데 승인은 계속 진행된다. TossPaymentsStartupGuard 가 본다.
          # 승인은 카드사 응답을 기다려 수 초 걸릴 수 있어 내부 호출(3s)보다 길게 둔다. 넘으면 실패가 아니라 UNKNOWN 이다 (payment-guide.md §4).
          # request-interceptors 는 두지 않는다 — 인증 헤더는 클라이언트 메서드 인자다.
          # logger-level 도 두지 않는다. 설정 클래스(TossPaymentsClientConfiguration)의 기본은 NONE 이지만 yml 값(default · toss-payments)이 있으면 그쪽이 이긴다 —
          # HEADERS · FULL 이면 Basic 헤더(시크릿 키)가 로그에 남으므로 TossPaymentsStartupGuard 가 기동을 막는다
          toss-payments:
            connect-timeout: 2000
            read-timeout: 6000

# 외부 · 서비스 간 호출 서킷 (coding-conventions.md §10). TossPaymentsResponseSupport · OrderInternalResponseSupport 가 인스턴스 이름으로 감싼다.
# spring.cloud.openfeign.circuitbreaker 통합은 켜지 않는다 — 서킷과 결과 분류를 한 곳(support)에서 한다
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      # 토스페이먼츠 승인 · 조회. 열려 있으면 승인 요청을 보내지 않는다 — 결제 시도는 READY 로 되돌린다 (payment-guide.md §4)
      toss:
        base-config: default
        # 4xx 는 우리 요청 · 설정 문제이거나 업무 거절(카드 거절 등)이다 — PG 장애로 세지 않는다. 5xx · 429 · 타임아웃 · 연결 실패는 센다.
        # ignore-exceptions(FeignClientException) 로 두면 그 하위인 429(TooManyRequests)까지 빠지고, Retry-After 가 붙은 429(RetryableException)만 세어져
        # 같은 429 가 헤더에 따라 달리 세어진다 — 술어로 429 만 빼고 무시한다. default 에 ignore-exceptions 를 두지 않는다(둘은 OR 로 합쳐진다)
        ignore-exception-predicate: com.commercefoundry.domainlayer.payment.adapter.out.client.pg.toss.TossCircuitBreakerIgnorePredicate
      # order-service internal 호출 — 결제 준비의 주문 요약 (GET /internal/v1/orders/{orderId}/payment-summary). OrderInternalResponseSupport 가 감싼다.
      # 4xx(주문 없음 ORDER_001 · 서비스 인증 실패 등)는 대상 장애가 아니다 — 이 인스턴스에만 ignore-exceptions 를 둔다.
      # default 에 두면 toss 인스턴스의 술어와 OR 로 합쳐져 토스 429 가 서킷 실패에서 빠진다 (coding-conventions.md §10)
      order-service:
        base-config: default
        ignore-exceptions:
          - feign.FeignException$FeignClientException

# 결제 준비 (payment-guide.md "고객 API 계약"). 주문의 결제 기한까지 이보다 적게 남았으면 결제창을 열지 않는다(409 PAYMENT_004) — 토스 인증 뒤 승인 제한도 10분이다
payment:
  auto-cancel:
    enabled: false
    scheduler:
      initial-delay: 1m
      fixed-delay: 1m
      lock-at-most-for: 15m
      page-size: 5
      max-pages-per-lane: 1
  order-result:
    pending-after: 5m
    reconciliation:
      enabled: false
      initial-delay: 1m
      fixed-delay: 1m
      lock-at-most-for: 10m
      page-size: 10
      max-pages-per-lane: 1
  recovery:
    enabled: false
    initial-delay: 1m
    fixed-delay: 1m
    unknown-inquiry-after: 1m
    stale-in-progress-after: 5m
    returned-ready-after: 10m
    manual-review-after: 24h
    page-size: 10
    max-pages-per-status-per-tick: 1
  # 운영 결제 게이트 — 기본 닫힘. 꺼져 있으면 결제 준비 · 승인이 DB · PG · order 호출 전에 503 PAYMENT_015 다(상태 조회는 막지 않는다).
  # #308(결제 완료 → 주문 반영) · #15(UNKNOWN 재조회 · IN_PROGRESS 정체 복구 · 되돌린 READY 정리)가 들어오기 전에는 운영에서 켜지 않는다.
  # 토스 테스트 키 환경인 local · dev 만 프로파일 yml 이 켠다 — prod 는 프로파일 yml 이 없어 false 다
  enabled: false
  prepare:
    min-remaining: 10m

# 토스페이먼츠 (payment-guide.md §2). 키 형식 · 프로파일 조건은 TossPaymentsStartupGuard 가 기동 때 본다
toss:
  # 시크릿 키 — Vault TOSS_SECRET_KEY (secret-management.md). local · dev 는 test_ 키, 그 밖은 live_ 키만 받는다. 기본값을 두지 않는다
  secret-key: ${TOSS_SECRET_KEY}
  base-url: https://api.tosspayments.com

eureka:
  client:
    # 레지스트리는 HTTP Basic 이다 (#248, security-guide.md §12). 사용자는 eureka 고정, 비밀번호 EUREKA_PASSWORD 는 기본값이 없다.
    # 클라이언트가 URL 의 userinfo 를 Basic 헤더로 바꿔 싣는다 — 비밀번호는 영문 · 숫자 · . _ ~ - 만 (openssl rand -hex 32)
    service-url:
      defaultZone: http://eureka:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:8761/eureka/
    # 기동 때 등록이 실패하면(401 · 연결 불가) 기동을 멈춘다 — 자격 증명이 틀린 채 "등록 안 된 UP" 으로 숨지 않게
    should-enforce-registration-at-init: true
  instance:
    # 컨테이너 호스트 이름(컨테이너 ID)이 아니라 네트워크 IP 로 등록한다 — 게이트웨이 lb:// · Feign 이 이름을 풀지 못하는 일을 막는다 (#249).
    # 배포(dev · prod) 기본값이다. local 은 application-local.yml 이 끈다
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health

snowflake:
  # 인스턴스마다 (datacenter-id, worker-id) 쌍이 달라야 한다. 겹치면 같은 밀리초에 같은 ID 가 나온다.
  # 기본값을 두지 않는다 — 값이 빠진 배포 환경이 0/0 으로 조용히 뜨지 않고 기동에 실패하게. local 은 프로파일 yml 이 덮는다
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID}
  worker-id: ${SNOWFLAKE_WORKER_ID}

security:
  jwt:
    # access 토큰 검증 공개키 — PEM 본문 한 줄 (security-guide.md §5-3 · §6). 비었거나 풀리지 않으면 기동하지 않는다.
    # issuer · audience · clock-skew 는 기본값을 쓴다. 테스트는 security-core 테스트 픽스처가 실행 중 만든 키를 넣는다
    public-key: ${JWT_PUBLIC_KEY}
    # 키 교체 중에만 이전 공개키를 넣는다 (security-guide.md §6-3)
    previous-public-key: ${JWT_PUBLIC_KEY_PREVIOUS:}
  # 서비스 간 internal API 의 서비스 토큰 (security-guide.md §9). 수명은 기본값(60초)을 쓴다
  internal:
    # 보내는 토큰의 iss 이자 받는 토큰에 있어야 하는 aud — Eureka 서비스 ID
    service-id: ${spring.application.name}
    # 서비스 5종 공용 HS256 비밀 — base64 32바이트 이상(openssl rand -base64 32). 비었거나 풀리지 않으면 기동하지 않는다.
    # 테스트는 security-core 테스트 픽스처가 실행 중 만든 비밀을 넣는다
    secret: ${INTERNAL_JWT_SECRET}
    # 키 교체 중에만 이전 비밀을 넣는다 (security-guide.md §9 교체 런북)
    previous-secret: ${INTERNAL_JWT_SECRET_PREVIOUS:}

swagger:
  # 상대 경로라 문서를 불러온 origin(게이트웨이 또는 서비스 직접)으로 "Try it out" 요청이 간다
  server-url: /

# Swagger 는 기본 닫힘이다. local · dev 프로파일만 연다 — 프로파일이 빠진 배포 환경에서 문서가 열리지 않게.
springdoc:
  # 그룹 없는 기본 문서(/v3/api-docs)는 그룹의 경로 필터를 거치지 않아 /internal/** 까지 담는다. 그룹 문서만 낸다
  enable-default-api-docs: false
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    # 외부 검증 배지(validator.swagger.io)로 문서 주소를 보내지 않는다
    validator-url: none

logging:
  level:
    # kafka-clients 의 "*Config values" INFO 로그에 접속 주소가 찍힌다 (messaging-core README)
    org.apache.kafka.clients.producer.ProducerConfig: WARN
    org.apache.kafka.clients.consumer.ConsumerConfig: WARN
    org.apache.kafka.clients.admin.AdminClientConfig: WARN
    # Eureka 에 닿지 않으면 이 데코레이터가 INFO · WARN 로그에 defaultZone 원문(비밀번호 포함)을 남긴다 (#248, security-guide.md §12-3).
    # 연결 실패 신호는 RetryableEurekaHttpClient 의 WARN 이 남긴다. com.netflix.discovery 를 DEBUG 로 올리지 않는다 — 같은 이유로 비밀번호가 나온다
    com.netflix.discovery.shared.transport.decorator.RedirectingEurekaHttpClient: ERROR

# Kafka 메시징 (core/messaging-core/README.md, #308). 결제 승인(DONE) 기록과 같은 트랜잭션에서 payment-approved 를 outbox(payment.outbox)에 넣는다.
# 꺼져 있어도 outbox 에는 쌓인다 — 릴레이만 멈추고, 켜면 쌓인 것부터 나간다 (payment-guide.md §6)
commerce:
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    namespace: ${KAFKA_NAMESPACE:}
    # 토픽 이름의 서비스 토막 — 토픽 <ns>.payment.payment-approved (docker/kafka/topics.txt)
    service: payment
    required-topics:
      - payment.payment-approved
      - payment.payment-approved.dlt
    # outbox 릴레이 · 정리의 단일 실행 락 테이블. order-service 처럼 서비스 스키마를 붙인다
    outbox:
      relay:
        lock-table: payment.shedlock
