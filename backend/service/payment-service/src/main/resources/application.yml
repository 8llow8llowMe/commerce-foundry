server:
  port: 8084

spring:
  application:
    name: payment-service
  # 값은 환경변수로 받는다 (secret-management.md). local 은 backend/.env 를 읽는다 (application-local.yml)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # 제약 위반 같은 서버 오류 메시지에 행 값(DETAIL)을 싣지 않는다 — Hibernate 가 예외를 바꾸기 전에 그 메시지를 WARN 로그로 남긴다 (#173, coding-conventions.md §8).
        # pgjdbc 속성 이름 그대로 쓴다 — 대소문자가 다르거나 오타면 드라이버가 조용히 무시한다. H2(컨텍스트 테스트)도 모르는 속성이라 무시한다
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      # 운영은 애플리케이션이 스키마를 건드리지 않는다 — DDL 은 사람이 직접 적용한다. local · dev 만 update 로 덮는다
      ddl-auto: none
    properties:
      hibernate:
        # 서비스별 스키마 (service-inventory.md §4). 다른 서비스 스키마를 직접 조회하지 않는다
        default_schema: payment
        query:
          # IN 절 바인드 파라미터 수를 2의 거듭제곱으로 채운다 — 개수마다 다른 SQL 이 생겨 쿼리 계획 · PreparedStatement 캐시가 늘어나지 않게 (coding-conventions.md §9-6)
          in_clause_parameter_padding: true
  web:
    resources:
      # 정적 리소스를 내지 않는다. 켜 두면 Swagger 를 닫아도 /webjars/swagger-ui/** 가 그대로 열린다 (Swagger UI 는 springdoc 이 따로 낸다)
      add-mappings: false
  cloud:
    openfeign:
      client:
        config:
          # 토스페이먼츠 클라이언트(TossPaymentsClient)만의 타임아웃 (ms). 기본 read timeout 60초를 그대로 두지 않는다 (coding-conventions.md §10, architecture-guide.md §8).
          # read 는 게이트웨이 응답 타임아웃(10s)보다 짧아야 한다 — 게이트웨이가 먼저 끊으면 고객은 실패를 보는데 승인은 계속 진행된다. TossPaymentsStartupGuard 가 본다.
          # 승인은 카드사 응답을 기다려 수 초 걸릴 수 있어 내부 호출(3s)보다 길게 둔다. 넘으면 실패가 아니라 UNKNOWN 이다 (payment-guide.md §4).
          # request-interceptors 는 두지 않는다 — 인증 헤더는 클라이언트 메서드 인자다. logger-level 도 두지 않는다(설정 클래스가 NONE 으로 고정한다)
          toss-payments:
            connect-timeout: 2000
            read-timeout: 6000

# 외부 호출 서킷 (coding-conventions.md §10). TossPaymentsResponseSupport 가 인스턴스 이름으로 감싼다.
# spring.cloud.openfeign.circuitbreaker 통합은 켜지 않는다 — 서킷과 결과 분류를 한 곳(support)에서 한다
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # 4xx 는 우리 요청 · 설정 문제이거나 업무 거절(카드 거절 등)이다 — PG 장애로 세지 않는다. 5xx · 429 · 타임아웃 · 연결 실패만 센다
        ignore-exceptions:
          - feign.FeignException$FeignClientException
    instances:
      # 토스페이먼츠 승인 · 조회. 열려 있으면 승인 요청을 보내지 않는다 — 결제 시도는 READY 로 되돌린다 (payment-guide.md §4)
      toss:
        base-config: default

# 토스페이먼츠 (payment-guide.md §2). 키 형식 · 프로파일 조건은 TossPaymentsStartupGuard 가 기동 때 본다
toss:
  # 시크릿 키 — Vault TOSS_SECRET_KEY (secret-management.md). local · dev 는 test_ 키, 그 밖은 live_ 키만 받는다. 기본값을 두지 않는다
  secret-key: ${TOSS_SECRET_KEY}
  base-url: https://api.tosspayments.com

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health

snowflake:
  # 인스턴스마다 (datacenter-id, worker-id) 쌍이 달라야 한다. 겹치면 같은 밀리초에 같은 ID 가 나온다.
  # 기본값을 두지 않는다 — 값이 빠진 배포 환경이 0/0 으로 조용히 뜨지 않고 기동에 실패하게. local 은 프로파일 yml 이 덮는다
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID}
  worker-id: ${SNOWFLAKE_WORKER_ID}

security:
  jwt:
    # access 토큰 검증 공개키 — PEM 본문 한 줄 (security-guide.md §5-3 · §6). 비었거나 풀리지 않으면 기동하지 않는다.
    # issuer · audience · clock-skew 는 기본값을 쓴다. 테스트는 security-core 테스트 픽스처가 실행 중 만든 키를 넣는다
    public-key: ${JWT_PUBLIC_KEY}
    # 키 교체 중에만 이전 공개키를 넣는다 (security-guide.md §6-3)
    previous-public-key: ${JWT_PUBLIC_KEY_PREVIOUS:}
  # 서비스 간 internal API 의 서비스 토큰 (security-guide.md §9). 수명은 기본값(60초)을 쓴다
  internal:
    # 보내는 토큰의 iss 이자 받는 토큰에 있어야 하는 aud — Eureka 서비스 ID
    service-id: ${spring.application.name}
    # 서비스 5종 공용 HS256 비밀 — base64 32바이트 이상(openssl rand -base64 32). 비었거나 풀리지 않으면 기동하지 않는다.
    # 테스트는 security-core 테스트 픽스처가 실행 중 만든 비밀을 넣는다
    secret: ${INTERNAL_JWT_SECRET}
    # 키 교체 중에만 이전 비밀을 넣는다 (security-guide.md §9 교체 런북)
    previous-secret: ${INTERNAL_JWT_SECRET_PREVIOUS:}

swagger:
  # 상대 경로라 문서를 불러온 origin(게이트웨이 또는 서비스 직접)으로 "Try it out" 요청이 간다
  server-url: /

# Swagger 는 기본 닫힘이다. local · dev 프로파일만 연다 — 프로파일이 빠진 배포 환경에서 문서가 열리지 않게.
springdoc:
  # 그룹 없는 기본 문서(/v3/api-docs)는 그룹의 경로 필터를 거치지 않아 /internal/** 까지 담는다. 그룹 문서만 낸다
  enable-default-api-docs: false
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    # 외부 검증 배지(validator.swagger.io)로 문서 주소를 보내지 않는다
    validator-url: none
