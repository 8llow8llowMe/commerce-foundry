dependencies {
    implementation project(':core:common-core')
    // 결제 승인 이벤트(payment-approved) outbox 발행 (#308, payment-guide.md §6)
    implementation project(':core:messaging-core')
    implementation project(':core:commerce-support')
    implementation project(':core:persistence-core')
    implementation project(':core:security-core')
    implementation project(':core:shared-commerce')

    // security-core 는 서블릿 · Boot 보안 자동설정을 compileOnly 로만 둔다 — 서블릿 서비스가 직접 선언한다 (security-guide.md §5-3)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // 토스페이먼츠 API 클라이언트 (adapter/out/client/pg/toss). 외부 API 라 서비스 토큰 설정을 붙이지 않는다 (coding-conventions.md §10)
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // 서킷은 TossPaymentsResponseSupport 가 직접 감싼다 — spring.cloud.openfeign.circuitbreaker 통합은 켜지 않는다 (order-service 와 같은 방식)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${rootProject.ext.springdocVersion}"

    // Q 클래스 생성기. persistence-core 의 annotationProcessor 는 전이되지 않아 엔티티를 가진 모듈마다 선언한다
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${rootProject.ext.querydslVersion}:jpa"

    // Entity ↔ Domain 매퍼 (coding-conventions.md §4). 처리기는 lombok(루트) → lombok-mapstruct-binding → mapstruct-processor 순서다
    implementation "org.mapstruct:mapstruct:${rootProject.ext.mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${rootProject.ext.lombokMapstructBindingVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${rootProject.ext.mapstructVersion}"

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 테스트 키 · 토큰 · 인가 스모크(ResourceServerSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:security-core'))
    // 폴백 오류 봉투 스모크(FallbackErrorSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:common-core'))
    // 가짜 outbox 저장소 · 트랜잭션 관리자(InMemoryOutboxStore · NoOpTransactionManager) — 발행이 결과 기록과 함께 커밋 · 롤백되는지 본다
    testImplementation testFixtures(project(':core:messaging-core'))
    // 컨텍스트 로딩 테스트용 (application-test.yml). Docker 없이 로컬·CI 가 같은 결과를 낸다
    testRuntimeOnly 'com.h2database:h2'

    // 리포지토리 테스트 (@DataJpaTest + PostgreSQL 컨테이너). Docker 없는 로컬은 건너뛰고 CI 는 실패한다 (bootstrap-conventions.md)
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // 서비스 배선 시험에서만 단일 실행 락을 대체한다. messaging-core의 런타임 implementation 의존은 노출하지 않는다.
    testImplementation "net.javacrumbs.shedlock:shedlock-core:${rootProject.ext.shedlockVersion}"
    // 토스 어댑터 테스트 — 가짜 토스 서버로 성공 · 거절 · 타임아웃 · 5xx · 연결 실패를 재현한다 (payment-guide.md §11). Docker 없이 돈다
    testImplementation "org.wiremock:wiremock-standalone:${rootProject.ext.wiremockVersion}"
}

// CI 로그에서도 구 DB upgrade · 실제 저장소 계약 · cleanup 배선의 메서드별 실행 결과를 확인한다.
tasks.named('test') {
    afterTest { descriptor, result ->
        if (descriptor.className?.endsWith('PaymentProcessedEventUpgradePostgresTest')
            || descriptor.className?.endsWith('PaymentProcessedEventStorePostgresTest')
            || descriptor.className?.endsWith('PaymentInboxLifecycleConfigTest')) {
            logger.lifecycle("C3a-1 critical ${descriptor.className}.${descriptor.name}: ${result.resultType}")
        }
    }
}
