dependencies {
    implementation project(':core:common-core')
    implementation project(':core:messaging-core')
    implementation project(':core:commerce-support')
    implementation project(':core:persistence-core')
    implementation project(':core:security-core')
    implementation project(':core:shared-commerce')

    // security-core 는 서블릿 · Boot 보안 자동설정을 compileOnly 로만 둔다 — 서블릿 서비스가 직접 선언한다 (security-guide.md §5-3)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${rootProject.ext.springdocVersion}"

    // internal API 호출 — product-service SKU 조회(#12), delivery-service 배송비 견적(#13). 버전은 Spring Cloud BOM 이다.
    // security-core 는 Feign 을 compileOnly 로만 둔다 — Feign 클라이언트를 가진 서비스가 직접 선언한다 (security-guide.md §9-5)
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    // 서킷은 adapter/out/client/support 가 직접 감싼다 (coding-conventions.md §10) — spring.cloud.openfeign.circuitbreaker 통합은 켜지 않는다
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'

    // Q 클래스 생성기. persistence-core 의 annotationProcessor 는 전이되지 않아 엔티티를 가진 모듈마다 선언한다
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${rootProject.ext.querydslVersion}:jpa"

    // Entity ↔ Domain 매퍼 (coding-conventions.md §4). 처리기는 lombok(루트) → lombok-mapstruct-binding → mapstruct-processor 순서다
    implementation "org.mapstruct:mapstruct:${rootProject.ext.mapstructVersion}"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:${rootProject.ext.lombokMapstructBindingVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${rootProject.ext.mapstructVersion}"

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 테스트 키 · 토큰 · 인가 스모크(ResourceServerSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:security-core'))
    // 폴백 오류 봉투 스모크(FallbackErrorSmokeTestSupport). 테스트 클래스패스에만 들어간다
    testImplementation testFixtures(project(':core:common-core'))
    testImplementation testFixtures(project(':core:messaging-core'))
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    // 컨텍스트 로딩 테스트용 (application-test.yml). Docker 없이 로컬·CI 가 같은 결과를 낸다
    testRuntimeOnly 'com.h2database:h2'

    // 리포지토리 테스트 (@DataJpaTest + PostgreSQL 컨테이너). Docker 없는 로컬은 건너뛰고 CI 는 실패한다 (bootstrap-conventions.md)
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

// 긴 클래스패스는 파일에 두고 테스트 JVM 명령줄에는 파일 경로만 전달한다.
tasks.named('test') {
    doFirst {
        def classpathFile = layout.buildDirectory.file('test-runtime-classpath.txt').get().asFile
        layout.buildDirectory.get().asFile.mkdirs()
        classpathFile.setText(sourceSets.test.runtimeClasspath.asPath, 'UTF-8')
        systemProperty 'order.test.runtimeClasspathFile', classpathFile.absolutePath
    }
    afterTest { descriptor, result ->
        if (descriptor.className?.endsWith('OrderPaymentSchemaUpgradePostgresTest')
            || descriptor.className?.endsWith('OrderStockRestorationRepositoryPostgresTest')
            || descriptor.className?.endsWith('OrderPaymentConsumerPostgresTest')
            || descriptor.className?.endsWith('OrderPaymentCrashRecoveryPostgresTest')) {
            logger.lifecycle("C2b critical ${descriptor.className}.${descriptor.name}: ${result.resultType}")
        }
        if (descriptor.className?.endsWith('CancellationRefundRecoveryPostgresTest')) {
            logger.lifecycle("A2a refund recovery ${descriptor.className}.${descriptor.name}: ${result.resultType}")
        }
    }
    // 테스트 worker 힙(#731). 지정하지 않으면 Gradle 기본 512m 다. CI 는 Testcontainers(PostgreSQL · Kafka) 통합 시험까지 돌아
    // 캐시되는 Spring 컨텍스트가 많아져 512m 에서 클래스패스 스캔 중 OOM 이 났다. 로컬은 여러 세션이 같은 PC 에서 빌드하고
    // Docker 통합 시험이 건너뛰어지므로 기본값을 유지한다.
    if (System.getenv('CI') == 'true') {
        maxHeapSize = '1536m'
    }
    // OOM 뒤 Kafka/Hikari 스레드만 살아 CI 제한 시간까지 대기하지 않도록 worker 를 즉시 실패시킨다(product-service 와 같다).
    jvmArgs '-XX:+ExitOnOutOfMemoryError'
}
