# dev 서버. 값은 Vault 에서 환경변수로 주입한다 (secret-management.md §3 · 주입 방식은 #32).

spring:
  jpa:
    hibernate:
      # 서비스가 뜰 때 개발 DB 스키마를 엔티티에 맞춘다. 운영은 공통 기본값 none 이다
      ddl-auto: update

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

order:
  cancellation:
    retry:
      # dev 는 결제 후 취소를 열어 둔다 — 재시도 스케줄러가 꺼져 있으면 결제 후 취소는 503 ORDER_035 다 (#16 PR-2)
      enabled: true
