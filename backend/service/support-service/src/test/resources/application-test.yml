# 컨텍스트 로딩 테스트 전용 프로파일. 목적은 "빈 정의가 끝까지 조립되는가" 하나다 — 외부 의존은 끊는다.
#   - DB: H2 인메모리(PostgreSQL 모드). Docker 없이 로컬과 CI 가 같은 결과를 낸다.
#     락 · timestamptz · 인덱스처럼 엔진에 기대는 동작은 여기서 검증되지 않는다 — 리포지토리 테스트는 Testcontainers 로 따로 둔다.
#   - Eureka: 끈다. 등록·조회를 시도하면 CI 에서 연결 오류로 늘어진다.
#   - Redis: 기동 가드를 통과하는 값만 둔다. 연결은 처음 쓸 때 맺으므로 컨텍스트 로딩은 Redis 없이 끝난다.
# 값은 전부 테스트 전용이다. 비밀이 아니다.

spring:
  cloud:
    discovery:
      enabled: false
  datasource:
    url: jdbc:h2:mem:support-context;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS support
    username: sa
    password:
  jpa:
    hibernate:
      # 엔티티 매핑 오류가 컨텍스트 로딩에서 드러나게 실제로 테이블을 만든다
      ddl-auto: create-drop
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: support-test-only
      timeout: 1s
      connect-timeout: 2s

eureka:
  client:
    enabled: false

snowflake:
  datacenter-id: 1
  worker-id: 1
