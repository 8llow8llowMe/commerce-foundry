server:
  port: 8087

spring:
  application:
    name: support-service
  # 값은 환경변수로 받는다 (secret-management.md). local 은 backend/.env 를 읽는다 (application-local.yml)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 운영은 애플리케이션이 스키마를 건드리지 않는다 — DDL 은 사람이 직접 적용한다. local · dev 만 update 로 덮는다
      ddl-auto: none
    properties:
      hibernate:
        # 서비스별 스키마 (service-inventory.md §4). 다른 서비스 스키마를 직접 조회하지 않는다
        default_schema: support
        query:
          # IN 절 바인드 파라미터 수를 2의 거듭제곱으로 채운다 — 개수마다 다른 SQL 이 생겨 쿼리 계획 · PreparedStatement 캐시가 늘어나지 않게 (coding-conventions.md §9-6)
          in_clause_parameter_padding: true
  web:
    resources:
      # 정적 리소스를 내지 않는다. 켜 두면 Swagger 를 닫아도 /webjars/swagger-ui/** 가 그대로 열린다 (Swagger UI 는 springdoc 이 따로 낸다)
      add-mappings: false
  data:
    redis:
      # WebSocket 1회용 티켓(GETDEL) · 인스턴스 간 대화 이벤트 전달(pub/sub, support:events:*)을 다음 PR(#470-C)이 쓴다. 지금은 연결 설정 · 기동 가드뿐이다.
      # 규칙 · 기동 가드는 coding-conventions.md §9-7
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 1s            # 명령 타임아웃 — 없거나 0 이하면 기동하지 않는다
      connect-timeout: 2s    # 연결 타임아웃 — 없거나 0 이하면 기동하지 않는다

eureka:
  client:
    # 레지스트리는 HTTP Basic 이다 (#248, security-guide.md §12). 사용자는 eureka 고정, 비밀번호 EUREKA_PASSWORD 는 기본값이 없다.
    # 클라이언트가 URL 의 userinfo 를 Basic 헤더로 바꿔 싣는다 — 비밀번호는 영문 · 숫자 · . _ ~ - 만 (openssl rand -hex 32)
    service-url:
      defaultZone: http://eureka:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:8761/eureka/
    # 기동 때 등록이 실패하면(401 · 연결 불가) 기동을 멈춘다 — 자격 증명이 틀린 채 "등록 안 된 UP" 으로 숨지 않게
    should-enforce-registration-at-init: true
  instance:
    # 컨테이너 호스트 이름(컨테이너 ID)이 아니라 네트워크 IP 로 등록한다 — 게이트웨이 lb:// · Feign 이 이름을 풀지 못하는 일을 막는다 (#249).
    # 배포(dev · prod) 기본값이다. local 은 application-local.yml 이 끈다
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      # 헬스에 Redis 를 넣지 않는다 — 인스턴스가 모두 같이 쓰는 의존이라 장애면 모든 인스턴스가 함께 DOWN 이 돼 상담 REST 까지 통째로 빠진다.
      # Redis 장애 때 단일 인스턴스는 로컬 전달로 돌고, FE 는 폴링으로 강등한다 (#470 설계 5). DB 는 모든 API 가 쓰므로 그대로 둔다
      enabled: false

snowflake:
  # 인스턴스마다 (datacenter-id, worker-id) 쌍이 달라야 한다. 겹치면 같은 밀리초에 같은 ID 가 나온다.
  # 기본값을 두지 않는다 — 값이 빠진 배포 환경이 0/0 으로 조용히 뜨지 않고 기동에 실패하게. local 은 프로파일 yml 이 덮는다
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID}
  worker-id: ${SNOWFLAKE_WORKER_ID}

security:
  jwt:
    # access 토큰 검증 공개키 — PEM 본문 한 줄 (security-guide.md §5-3 · §6). 비었거나 풀리지 않으면 기동하지 않는다.
    # issuer · audience · clock-skew 는 기본값을 쓴다. 테스트는 security-core 테스트 픽스처가 실행 중 만든 키를 넣는다
    public-key: ${JWT_PUBLIC_KEY}
    # 키 교체 중에만 이전 공개키를 넣는다 (security-guide.md §6-3)
    previous-public-key: ${JWT_PUBLIC_KEY_PREVIOUS:}
  # 서비스 간 internal API 의 서비스 토큰 (security-guide.md §9). 수명은 기본값(60초)을 쓴다
  internal:
    # 보내는 토큰의 iss 이자 받는 토큰에 있어야 하는 aud — Eureka 서비스 ID
    service-id: ${spring.application.name}
    # 서비스 전부가 같이 쓰는 HS256 비밀 — base64 32바이트 이상(openssl rand -base64 32). 비었거나 풀리지 않으면 기동하지 않는다.
    # 테스트는 security-core 테스트 픽스처가 실행 중 만든 비밀을 넣는다
    secret: ${INTERNAL_JWT_SECRET}
    # 키 교체 중에만 이전 비밀을 넣는다 (security-guide.md §9 교체 런북)
    previous-secret: ${INTERNAL_JWT_SECRET_PREVIOUS:}

swagger:
  # 상대 경로라 문서를 불러온 origin(게이트웨이 또는 서비스 직접)으로 "Try it out" 요청이 간다
  server-url: /

# Swagger 는 기본 닫힘이다. local · dev 프로파일만 연다 — 프로파일이 빠진 배포 환경에서 문서가 열리지 않게.
springdoc:
  # 그룹 없는 기본 문서(/v3/api-docs)는 그룹의 경로 필터를 거치지 않아 /internal/** 까지 담는다. 그룹 문서만 낸다
  enable-default-api-docs: false
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    # 외부 검증 배지(validator.swagger.io)로 문서 주소를 보내지 않는다
    validator-url: none

logging:
  level:
    # Eureka 에 닿지 않으면 이 데코레이터가 INFO · WARN 로그에 defaultZone 원문(비밀번호 포함)을 남긴다 (#248, security-guide.md §12-3).
    # 연결 실패 신호는 RetryableEurekaHttpClient 의 WARN 이 남긴다. com.netflix.discovery 를 DEBUG 로 올리지 않는다 — 같은 이유로 비밀번호가 나온다
    com.netflix.discovery.shared.transport.decorator.RedirectingEurekaHttpClient: ERROR
