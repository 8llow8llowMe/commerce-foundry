# Gradle 데몬 JVM 설정 — 기본 512m 힙은 서비스 모듈이 늘면 부족하다 (hondigagae 에서 데몬 크래시 이력)
org.gradle.jvmargs=-Xmx2g -Xms512m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
# 로컬 빌드 캐시는 켠다. 테스트가 실제로 돌았는지 볼 때는 `cleanTest ... --no-build-cache` 로 끈다
org.gradle.caching=true
