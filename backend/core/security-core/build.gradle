import org.gradle.api.artifacts.component.ModuleComponentIdentifier

plugins {
    // 서비스 · 게이트웨이 테스트가 같이 쓰는 테스트 키 · 토큰 · 봉투 단언 · 인가 스모크 (src/testFixtures).
    // 소비자는 testImplementation testFixtures(project(':core:security-core')) 로만 받는다 — 실행 클래스패스에 들어가지 않는다
    id 'java-test-fixtures'
}

dependencies {
    implementation project(':core:common-core')

    // JWT 발급·검증은 Spring Security JOSE(Nimbus)만 쓴다. 서비스·게이트웨이가 디코더·주체 타입을 그대로 받으므로 api 다
    api 'org.springframework.security:spring-security-oauth2-jose'
    api 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'org.slf4j:slf4j-api'

    // 서블릿 · Boot 보안 자동설정은 컴파일에만 쓴다. 서블릿 서비스가 spring-boot-starter-security · spring-boot-starter-webmvc 를 직접 선언한다.
    // api/implementation 으로 넣으면 리액티브 게이트웨이에 서블릿 스택과 Boot 기본 보안 체인이 새어 들어간다 (common-core 와 같은 판단)
    // actuator 경로 규칙(EndpointRequest)도 spring-boot-security 에 있다 — 실행 모듈은 전부 actuator 를 가진다 (backend/build.gradle)
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.springframework:spring-webmvc'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    // token.reactive 만 쓴다. reactor 는 게이트웨이에 이미 있다
    compileOnly 'io.projectreactor:reactor-core'
    // internal.client(서비스 토큰 Feign 인터셉터)만 쓴다. Feign 클라이언트를 가진 서비스가 openfeign 스타터로 직접 가져온다 — 버전은 Spring Cloud BOM
    compileOnly 'io.github.openfeign:feign-core'
    // token.revocation(로그아웃 차단 목록 키 함수)만 쓴다. 키를 쓰는 auth 와 읽는 api-gateway 가 redis-core 를 직접 의존한다 —
    // Redis 를 쓰지 않는 서비스에 Lettuce · 기동 가드가 끌려가지 않게 (coding-conventions.md §9-7 서비스 횡단 키)
    compileOnly project(':core:redis-core')

    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'tools.jackson.core:jackson-databind'
    // 서블릿 · MockMvc 는 픽스처도 컴파일에만 쓴다 — 리액티브 게이트웨이(#4)가 키 · 토큰 픽스처를 받아도 서블릿 스택이 끌려가지 않게.
    // 스모크(ResourceServerSmokeTestSupport)를 쓰는 서블릿 서비스는 이미 spring-boot-starter-webmvc-test 를 가진다
    testFixturesCompileOnly 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testFixturesCompileOnly 'jakarta.servlet:jakarta.servlet-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // actuator 경로 규칙(health 만 열고 나머지 노출 엔드포인트는 막는다)을 실제 엔드포인트로 본다
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'io.projectreactor:reactor-core'
    testImplementation 'io.github.openfeign:feign-core'
    // RedisKey 만 쓴다. 전이 의존(data-redis 스타터)을 받으면 이 모듈의 컨텍스트 테스트에 Redis 자동설정 · 헬스 지표가 켜진다
    testImplementation(project(':core:redis-core')) {
        transitive = false
    }
}

// 위 compileOnly(서블릿 · Boot 보안 자동설정 · Feign · Redis)가 api/implementation 으로 바뀌는 회귀를 막는다. 소비자에게 가는 두 클래스패스 — 본체(runtimeClasspath)와
// 테스트 픽스처(testFixturesRuntimeClasspath, 게이트웨이 테스트도 받는다) — 에 아래 모듈이 있으면 check 가 실패한다.
// 구성 시점에 Provider 로 잡아 두고 실행 시점에는 project 를 만지지 않는다 (configuration cache 안전)
def resolvedModules = { String configurationName ->
    configurations.named(configurationName).flatMap { classpath ->
        classpath.incoming.artifacts.resolvedArtifacts
    }.map { artifacts ->
        artifacts.collect { it.id.componentIdentifier }
            .findAll { it instanceof ModuleComponentIdentifier }
            .collect { "${it.group}:${it.module}".toString() }
            .sort()
    }
}
def runtimeModules = resolvedModules('runtimeClasspath')
def testFixturesRuntimeModules = resolvedModules('testFixturesRuntimeClasspath')

def verifyNoServletLeak = tasks.register('verifyNoServletLeak') {
    group = 'verification'
    description = 'security-core 의 runtimeClasspath · testFixturesRuntimeClasspath 에 서블릿 스택 · Boot 보안 자동설정 · Feign · Redis 가 없는지 확인한다'

    def forbiddenModules = [
        'org.springframework:spring-webmvc',
        'org.springframework.boot:spring-boot-webmvc',
        'org.springframework.boot:spring-boot-servlet',
        'org.springframework.boot:spring-boot-tomcat',
        'org.apache.tomcat.embed:tomcat-embed-core',
        'jakarta.servlet:jakarta.servlet-api',
        'org.springframework.boot:spring-boot-security',
        'org.springframework.security:spring-security-config',
        // Feign 을 쓰지 않는 서비스 · 게이트웨이에 Feign 이 끌려가지 않게 (internal.client)
        'io.github.openfeign:feign-core',
        // Redis 를 쓰지 않는 서비스 3종(product · payment · delivery)에 Lettuce · Redis 자동설정이 끌려가지 않게 (token.revocation).
        // 끌려가면 Redis 접속 설정 없이도 RedisConnectionFactory 가 생기고 헬스 지표가 localhost:6379 를 찌른다.
        // redis-core 자체는 프로젝트 의존이라 여기 이름으로 잡히지 않는다 — 그 전이 의존(아래 둘)으로 잡는다
        'io.lettuce:lettuce-core',
        'org.springframework.data:spring-data-redis',
    ]
    inputs.property('runtimeModules', runtimeModules)
    inputs.property('testFixturesRuntimeModules', testFixturesRuntimeModules)
    inputs.property('forbiddenModules', forbiddenModules)

    doLast {
        def leaked = [runtimeClasspath: runtimeModules.get(), testFixturesRuntimeClasspath: testFixturesRuntimeModules.get()]
            .collectEntries { name, modules -> [name, modules.findAll { it in forbiddenModules }] }
            .findAll { name, modules -> !modules.isEmpty() }
        if (!leaked.isEmpty()) {
            throw new GradleException("security-core 의 클래스패스에 서블릿 · Boot 보안 자동설정 · Feign · Redis 모듈이 들어왔습니다: ${leaked}. "
                + 'compileOnly 로 두고 소비 서비스가 직접 선언하게 하세요 (security-guide.md 의존)')
        }
    }
}

tasks.named('check') {
    dependsOn verifyNoServletLeak
}
