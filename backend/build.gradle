import org.springframework.boot.gradle.plugin.SpringBootPlugin

// 버전의 정본은 이 파일이다. 바꾸면 `backend/docs/service-inventory.md` 의 버전 표도 같이 고친다.
//
// Spring Boot 4.0.x 를 쓰는 이유: Spring Cloud 의 GA 릴리스 트레인(2025.1.x)이 지원하는 마지막 Boot 라인이다.
// 4.1 을 지원하는 트레인(2026.0)은 아직 마일스톤이다. 트레인이 GA 되면 함께 올린다.
plugins {
    id 'org.springframework.boot' version '4.0.8' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

// 하위 모듈은 `rootProject.ext.<이름>` 으로 명시해 읽는다. 이름만 쓰면 부모 프로젝트를 암묵 조회하는데,
// Gradle 9 에서 deprecated 이고 Gradle 10 에서 빌드가 깨진다.
ext {
    springCloudVersion = '2025.1.3'
    springdocVersion = '3.0.3'
    querydslVersion = '7.7'
}

allprojects {
    group = 'com.commercefoundry'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects { project ->
    // 껍데기 그룹 프로젝트(core/cloud/service)에는 아무 플러그인도 붙이지 않는다.
    // java 를 붙이면 빈 jar 를 만들고, Boot 를 붙이면 main class 없이 bootJar 를 만들려다 루트 빌드가 실패한다.
    if (project.name in ['core', 'cloud', 'service']) {
        return
    }

    // core 는 라이브러리(jar), cloud · service 는 실행 모듈(bootJar)이다.
    boolean library = project.parent.name == 'core'

    apply plugin: library ? 'java-library' : 'java'
    apply plugin: 'io.spring.dependency-management'
    if (!library) {
        apply plugin: 'org.springframework.boot'
        tasks.named('jar') { enabled = false }
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${rootProject.ext.springCloudVersion}"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // Windows CP949 혼입 방지 — 전 모듈 UTF-8 강제
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // 라이브러리 모듈에는 Boot 플러그인이 없어 -parameters 가 자동으로 붙지 않는다
        options.compilerArgs << '-parameters'
    }
    tasks.withType(Test).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
        useJUnitPlatform()
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
