import org.springframework.boot.gradle.plugin.SpringBootPlugin

// 버전의 정본은 이 파일이다. 바꾸면 `backend/docs/service-inventory.md` 의 버전 표도 같이 고친다.
//
// Spring Boot 4.0.x 를 쓰는 이유: Spring Cloud 의 GA 릴리스 트레인(2025.1.x)이 지원하는 마지막 Boot 라인이다.
// 4.1 을 지원하는 트레인(2026.0)은 아직 마일스톤이다. 트레인이 GA 되면 함께 올린다.
plugins {
    id 'org.springframework.boot' version '4.0.8' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

// 하위 모듈은 `rootProject.ext.<이름>` 으로 명시해 읽는다. 이름만 쓰면 부모 프로젝트를 암묵 조회하는데,
// Gradle 9 에서 deprecated 이고 Gradle 10 에서 빌드가 깨진다.
ext {
    springCloudVersion = '2025.1.3'
    springdocVersion = '3.0.3'
    querydslVersion = '7.7'
    // Entity ↔ Domain 매퍼 (coding-conventions.md §4). Boot BOM 이 관리하지 않아 여기서 고정한다
    mapstructVersion = '1.6.3'
    // Lombok 이 만든 생성자·빌더를 MapStruct 가 읽게 하는 처리기 연결
    lombokMapstructBindingVersion = '0.2.0'
}

allprojects {
    group = 'com.commercefoundry'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects { project ->
    // 껍데기 그룹 프로젝트(core/cloud/service)에는 아무 플러그인도 붙이지 않는다.
    // java 를 붙이면 빈 jar 를 만들고, Boot 를 붙이면 main class 없이 bootJar 를 만들려다 루트 빌드가 실패한다.
    if (project.name in ['core', 'cloud', 'service']) {
        return
    }

    // core 는 라이브러리(jar), cloud · service 는 실행 모듈(bootJar)이다.
    boolean library = project.parent.name == 'core'

    apply plugin: library ? 'java-library' : 'java'
    apply plugin: 'io.spring.dependency-management'
    if (!library) {
        apply plugin: 'org.springframework.boot'
        tasks.named('jar') { enabled = false }

        // bootRun(로컬 실행)만 SPRING_PROFILES_ACTIVE 가 없으면 local 로 띄운다. bootJar 로 만든 jar 실행에는 영향이 없다 —
        // 배포 환경이 프로파일을 빠뜨려도 local 설정(로컬 CORS origin, self-preservation off)으로 뜨지 않게 하려는 것이다.
        // 빈 값도 "없음" 으로 본다 — .env.example 의 빈 SPRING_PROFILES_ACTIVE= 를 셸에 export 한 경우
        boolean profileFromEnvironment = !project.providers.environmentVariable('SPRING_PROFILES_ACTIVE').getOrElse('').isBlank()
        tasks.named('bootRun', JavaExec) {
            if (!profileFromEnvironment) {
                systemProperty 'spring.profiles.active', 'local'
            }
        }

        // 실행 모듈은 전부 헬스 체크를 낸다 (노출 엔드포인트는 각 application.yml 이 health 로 좁힌다)
        dependencies {
            implementation 'org.springframework.boot:spring-boot-starter-actuator'
            // 실행 모듈은 eureka-client 를 통해 Spring Cloud LoadBalancer 를 쓴다(게이트웨이 lb:// · 서비스 Feign).
            // Caffeine 이 없으면 기본 캐시로 떨어지며 "운영에 쓰지 말라" WARN 을 남긴다
            implementation 'com.github.ben-manes.caffeine:caffeine'
        }

        // 테스트 픽스처가 실행 jar 로 새는 회귀(testFixtures(...) 를 implementation 으로 선언)를 check 에서 막는다
        def runtimeTestFixtures = configurations.named('runtimeClasspath').flatMap { it.incoming.artifacts.resolvedArtifacts }
            .map { artifacts -> artifacts.collectMany { it.variant.capabilities*.name }.findAll { it.endsWith('-test-fixtures') }.unique().sort() }
        def verifyNoTestFixturesAtRuntime = tasks.register('verifyNoTestFixturesAtRuntime') {
            inputs.property('runtimeTestFixtures', runtimeTestFixtures)
            doLast { if (!runtimeTestFixtures.get().isEmpty()) throw new GradleException("runtimeClasspath 에 테스트 픽스처가 있습니다: ${runtimeTestFixtures.get()}") }
        }
        tasks.named('check') { dependsOn verifyNoTestFixturesAtRuntime }
    }

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${rootProject.ext.springCloudVersion}"
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // Windows CP949 혼입 방지 — 전 모듈 UTF-8 강제
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // 라이브러리 모듈에는 Boot 플러그인이 없어 -parameters 가 자동으로 붙지 않는다
        options.compilerArgs << '-parameters'
    }
    // Mockito 는 inline mock maker 를 쓰려고 테스트 도중 byte-buddy 에이전트를 동적으로 붙인다.
    // JDK 21 은 이를 경고하고(JEP 451) 이후 버전에서 막는다 — 테스트 JVM 을 띄울 때 -javaagent 로 미리 붙인다 (Mockito 공식 권장).
    // 버전은 Boot BOM 이 관리하는 mockito-core 와 같다
    configurations {
        mockitoAgent
    }
    dependencies {
        mockitoAgent('org.mockito:mockito-core') {
            transitive = false
        }
    }

    tasks.withType(Test).configureEach {
        systemProperty 'file.encoding', 'UTF-8'
        useJUnitPlatform()
        jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
        // 에이전트가 부트스트랩 클래스패스를 덧붙이면 JVM 이 CDS 를 부분만 쓰겠다는 경고를 매번 찍는다. 테스트 JVM 에서만 CDS 를 끈다
        jvmArgs '-Xshare:off'
    }
    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
