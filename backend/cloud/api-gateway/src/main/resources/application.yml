server:
  port: 8000
  # 전달 헤더(X-Forwarded-For · Forwarded)로 원격 주소를 바꾸지 않는다. 클라이언트 IP 는 신뢰 프록시 목록으로만 정한다 (ClientIpResolver, security-guide.md §7-3).
  # 클라우드 플랫폼을 감지하면 Boot 가 기본값을 native 로 바꾸므로 명시한다
  forward-headers-strategy: none

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # 라우트의 정본은 ServiceRoute enum 이다 (api-design-guide.md §1-2). 여기에 routes 를 적지 않는다.
          discovery:
            locator:
              # 켜지 않는다. 켜면 Eureka 에 등록된 모든 서비스가 /<service-id>/** 로 자동 노출돼
              # /auth-service/internal/** 같은 서비스 간 API 까지 외부에서 닿는다.
              enabled: false
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
  web:
    resources:
      # 정적 리소스를 내지 않는다. 켜 두면 Swagger 를 닫아도 /webjars/swagger-ui/** 가 그대로 열린다 (Swagger UI 는 springdoc 이 따로 낸다)
      add-mappings: false
  data:
    redis:
      # 로그아웃 차단 목록(auth:revoked-access-token:{jti})을 읽는다 (security-guide.md §7). 규칙 · 기동 가드는 coding-conventions.md §9-7
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 1s            # 명령 타임아웃 — 없거나 0 이하면 기동하지 않는다
      connect-timeout: 2s    # 연결 타임아웃 — 없거나 0 이하면 기동하지 않는다

security:
  jwt:
    # access 토큰 검증 공개키 — PEM 본문 한 줄 (security-guide.md §6). 비었거나 풀리지 않으면 기동하지 않는다.
    # issuer · audience · clock-skew 는 기본값을 쓴다 — 서비스와 같은 값이어야 같은 토큰을 같게 판정한다. 테스트는 security-core 테스트 픽스처가 실행 중 만든 키를 넣는다
    public-key: ${JWT_PUBLIC_KEY}
    # 키 교체 중에만 이전 공개키를 넣는다 (security-guide.md §6-3)
    previous-public-key: ${JWT_PUBLIC_KEY_PREVIOUS:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

gateway:
  request-body:
    # 하류로 넘기는 요청 본문 상한 (security-guide.md §7-4). 넘으면 413 GATEWAY_007 이고 하류에 닿지 않는다.
    # 2MB 는 가장 큰 정상 요청(장바구니 병합 50줄 × 입력 20개 × 500자, 한글 약 1.5MB)이 들어가는 값이다. 검증 한도를 키우면 이 값도 같이 본다
    # 업로드(#9)는 그 라우트에만 따로 상한을 둔다 — Content-Type 만 바꿔 상한을 올릴 수 없게 전역 multipart 상한을 두지 않는다
    max-size: 2MB
    # chunked 본문을 동시에 모으는 총량(넘으면 411)과 수신 시간(넘으면 408) — 천천히 보내는 연결로 메모리를 채우는 공격의 상한
    buffering-budget: 32MB
    body-read-timeout: 10s
  cors:
    # 콤마로 여러 개를 적는다. 기본값은 비어 있다 — 설정이 빠진 배포 환경은 어떤 origin 도 허용하지 않고 닫힌 채로 뜬다.
    # 로컬 기본값(http://localhost:3000)은 application-local.yml 에 있다.
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}
  rate-limit:
    # 고객 쓰기 API 회원 · 클라이언트 IP 단위 요청 제한 (security-guide.md §7-3). 대상 경로는 RateLimitPolicy 가 정하고 한도만 여기서 바꾼다.
    # requests-per-minute 는 60 의 약수 또는 배수, burst 는 한 번에 몰아서 허용하는 요청 수다. Redis 장애 때는 통과(fail-open)한다
    enabled: true
    cart-merge:
      requests-per-minute: 6
      burst: 3
    cart-write:
      requests-per-minute: 60
      burst: 20
    order-write:
      requests-per-minute: 12
      burst: 5
  client-ip:
    # 토큰 없는 요청을 셀 때의 클라이언트 IP 규칙 (security-guide.md §7-3).
    # 믿는 프록시(LB · CDN)의 주소 · CIDR. 기본은 비어 있다 — X-Forwarded-For 를 무시하고 소켓의 원격 주소를 쓴다. LB 구성이 정해지면 그 대역만 넣는다
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
    # IP 를 Redis 키로 바꾸는 HMAC 키 (Vault). base64 32바이트 이상, 게이트웨이 인스턴스 전부 같은 값. 비었거나 풀리지 않으면 기동하지 않는다
    hash-key: ${GATEWAY_CLIENT_IP_HASH_KEY}
  dev-routes:
    # 서비스 헬스 체크(/health/{service-id})와 문서(/docs/{service-id}/v3/api-docs/{group}) 라우트를 연다 (GatewayDevRouteConfig).
    # 기본은 꺼짐이고 local · dev 만 켠다. 운영의 헬스 체크는 게이트웨이를 거치지 않고 내부망에서 서비스에 직접 붙는다.
    # 아래 springdoc 두 스위치와 항상 같은 값이어야 한다 — 프로파일 yml 에서 셋을 함께 켠다 (GatewayDevRouteProfileTest 가 지킨다).
    enabled: false

# 게이트웨이 자신은 API 문서가 없다. Swagger UI 만 띄워 서비스 문서(/docs/**)를 고르게 한다.
# 스위치는 리터럴로 둔다. ${gateway.dev-routes.enabled} 로 묶으면 "0" · "no" 같은 값에서 라우트는 닫히고 UI 만 열린다
# (springdoc 은 "false" 가 아니면 켠다).
# 목록은 서비스 5종 × 고객 / 어드민 그룹이다. 서비스를 더하면 여기도 더한다 (GatewayDevRouteTest 가 ServiceRoute 와 대조한다).
springdoc:
  enable-default-api-docs: false
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    # 외부 검증 배지(validator.swagger.io)로 문서 주소를 보내지 않는다.
    # query-config-enabled(?url= 로 외부 문서 주입) · persist-authorization(토큰을 브라우저 저장소에 남김)은 켜지 않는다.
    validator-url: none
    urls:
      - name: 인증 — 고객
        url: /docs/auth-service/v3/api-docs/customer
      - name: 인증 — 어드민
        url: /docs/auth-service/v3/api-docs/admin
      - name: 상품 — 고객
        url: /docs/product-service/v3/api-docs/customer
      - name: 상품 — 어드민
        url: /docs/product-service/v3/api-docs/admin
      - name: 주문 — 고객
        url: /docs/order-service/v3/api-docs/customer
      - name: 주문 — 어드민
        url: /docs/order-service/v3/api-docs/admin
      - name: 결제 — 고객
        url: /docs/payment-service/v3/api-docs/customer
      - name: 결제 — 어드민
        url: /docs/payment-service/v3/api-docs/admin
      - name: 배송 — 고객
        url: /docs/delivery-service/v3/api-docs/customer
      - name: 배송 — 어드민
        url: /docs/delivery-service/v3/api-docs/admin

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      # 게이트웨이 헬스에 Redis 를 넣지 않는다. Redis 장애에도 일반 경로는 통과(fail-open)시키기로 했는데(security-guide.md §7),
      # 헬스가 DOWN 이 되면 LB 가 게이트웨이를 빼 전체 장애가 된다. 차단 목록 장애는 fail-open warn 로그 · 어드민 503 으로 드러난다
      enabled: false

logging:
  level:
    # Redis 장애 때 Spring Cloud Gateway 의 RedisRateLimiter 가 요청마다 스택과 함께 error 를 남긴다 (오류는 삼키고 허용한다).
    # 그 신호는 RedisBucketRateLimiter 가 장애로 바꿔 GatewayRateLimitFilter 가 1분에 한 번 warn 으로 남기므로 프레임워크 로그는 끈다 (security-guide.md §7-3)
    org.springframework.cloud.gateway.filter.ratelimit.RedisRateLimiter: OFF
