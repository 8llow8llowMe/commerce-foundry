dependencies {
    implementation project(':core:common-core')
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    // lb:// 라우팅의 LoadBalancer 인스턴스 목록 캐시. 없으면 기본 캐시로 떨어지며 "운영에 쓰지 말라" WARN 을 남긴다
    implementation 'com.github.ben-manes.caffeine:caffeine'

    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
}

tasks.named('test') {
    // GatewayRouteCoverageTest 가 경로 소유 표(api-design-guide.md §1-2)를 읽어 ServiceRoute 와 대조한다.
    // 문서만 바뀌어도 테스트가 UP-TO-DATE 로 건너뛰지 않게 입력으로 선언한다
    inputs.file(rootProject.file('docs/api-design-guide.md'))
        .withPropertyName('routeOwnershipTable')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}
