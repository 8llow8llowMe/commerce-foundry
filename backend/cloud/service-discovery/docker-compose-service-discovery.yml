# service-discovery 배포 정의 (backend/docs/deploy-guide.md).
#
# 한 파일에 dev · prod 두 서비스를 두고, 배포 agent 는 환경마다 env 파일과 compose 프로젝트를 갈라 하나만 올린다.
#   docker compose -p commerce-service-discovery-dev --env-file .env.runtime -f docker-compose-service-discovery.yml up -d --build --wait service-discovery-dev
# -p 를 빼지 않는다 — 빠지면 디렉터리 이름이 프로젝트가 돼 다른 compose 와 섞이고 --remove-orphans 가 남의 컨테이너를 지울 수 있다.
# compose 는 파일 전체를 보간하므로 dev 배포에도 _PROD 키(포트)가 있어야 한다. 반대도 같다.
#
# 컨테이너 안 포트는 dev · prod 같다(8761, application.yml 의 server.port). 호스트 포트만 env 로 다르고 값은 #197 에서 정한다.
# 호스트 포트는 루프백에만 연다 — 서비스 · Eureka 는 사설망 전용이고 외부에는 게이트웨이만 연다(architecture-guide.md §6).
# 게이트웨이 라우팅 · Eureka 등록 · 서비스 간 호출은 같은 docker 네트워크 안에서 닿으므로 호스트 포트가 필요 없다. 호스트 포트는 점검용이다.
#
# 값은 저장소에 쓰지 않는다. 시크릿은 Vault, 이름은 backend/.env.example 과 같다(secret-management.md).
# environment 에는 이 모듈이 실제로 읽는 키만 넘긴다. yml 에 키를 더하면 여기와 .env.example 을 같은 PR 에서 맞춘다.

x-service-discovery-environment: &service_discovery_environment
  # JVM 시간대(로그 시각만 바뀐다). 비우면 UTC
  TIME_ZONE: ${TIME_ZONE:-UTC}
  # 레지스트리 HTTP Basic 비밀번호(#248). 게이트웨이 · 서비스와 같은 값이다. 영문 · 숫자 · . _ ~ - 만, 32자 이상 — 어긋나면 기동하지 않는다
  EUREKA_PASSWORD: ${EUREKA_PASSWORD:?deploy-guide.md 4절}

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# dev · prod 공통. 서비스마다 다른 것(이미지 태그 · 컨테이너 이름 · 포트 · 프로파일 · 메모리)만 아래에서 덮는다
x-service-discovery-common: &service_discovery_common
  build:
    context: .
    dockerfile: service-discovery.Dockerfile
  # 컨테이너 안에서 헬스를 본다. /actuator/health 는 익명으로 열려 있고(deploy-guide.md §5) DOWN 이면 503 이라 curl -f 가 실패한다
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8761/actuator/health"]
    interval: 15s
    timeout: 5s
    retries: 4
    # JVM · Spring Cloud 기동 시간. 이 안의 실패는 retries 에 세지 않는다
    start_period: 120s
  # Spring Boot graceful shutdown(단계당 30초)이 끝나기 전에 SIGKILL 하지 않게 docker 기본 10초보다 길게 둔다
  stop_grace_period: 40s
  restart: unless-stopped
  logging: *default_logging
  networks:
    - backend

services:
  service-discovery-dev:
    <<: *service_discovery_common
    # 이미지 이름은 dev · prod 가 같고 환경은 태그로 가른다 — 같은 호스트에서 dev 빌드가 prod 가 쓰는 이미지를 덮지 않게
    image: commerce-service-discovery:dev
    container_name: commerce-service-discovery-dev
    ports:
      - "127.0.0.1:${SERVICE_DISCOVERY_PORT_DEV:?deploy-guide.md 4절}:8761" # host:container
    environment:
      <<: *service_discovery_environment
      # 서비스 이름에 환경을 묶는다. env 파일 값에 맡기면 prod 컨테이너가 dev 프로파일(ddl-auto update · Swagger 열림)로 뜰 수 있다
      SPRING_PROFILES_ACTIVE: dev
    # 컨테이너 메모리 상한. JVM 힙은 Dockerfile 의 MaxRAMPercentage 가 이 값을 기준으로 정한다
    deploy:
      resources:
        limits:
          memory: ${SERVICE_DISCOVERY_MEM_LIMIT_DEV:-384m}

  service-discovery-prod:
    <<: *service_discovery_common
    image: commerce-service-discovery:prod
    container_name: commerce-service-discovery-prod
    ports:
      - "127.0.0.1:${SERVICE_DISCOVERY_PORT_PROD:?deploy-guide.md 4절}:8761" # host:container
    environment:
      <<: *service_discovery_environment
      # prod 프로파일 yml 은 없다 — 공통 application.yml 의 닫힌 기본값(ddl-auto none · Swagger 닫힘 · dev 라우트 꺼짐)으로 뜬다
      SPRING_PROFILES_ACTIVE: prod
    deploy:
      resources:
        limits:
          memory: ${SERVICE_DISCOVERY_MEM_LIMIT_PROD:-512m}

# 외부 네트워크 — 이름은 Infra 에서 정하고(#197) env 로 받는다. 배포 agent 가 없으면 만든다(deploy-guide.md §6)
networks:
  backend:
    name: ${COMMERCE_DOCKER_NETWORK:?deploy-guide.md 4절}
    external: true
