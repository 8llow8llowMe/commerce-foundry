# 로컬 개발 전용. bootRun 은 SPRING_PROFILES_ACTIVE 가 없으면 local 로 뜬다 (backend/build.gradle).

spring:
  config:
    # backend/.env 를 읽는다 (local-run-guide.md §2) — EUREKA_PASSWORD (#248). bootRun 의 작업 디렉터리는 모듈 디렉터리다.
    # OS 환경변수가 이 파일의 값보다 우선한다.
    import: optional:file:../../.env[.properties]

server:
  # 같은 LAN 의 다른 PC 가 인스턴스를 등록·삭제하지 못하게 루프백에만 묶는다. 레지스트리 인증(#248)과 이중 방어다.
  address: 127.0.0.1

eureka:
  server:
    # 로컬은 서비스를 자주 껐다 켠다. self-preservation 이 켜져 있으면 갱신이 끊긴 인스턴스를 지우지 않아
    # 게이트웨이가 이미 내려간 인스턴스로 라우팅한다.
    enable-self-preservation: false
  dashboard:
    # 로컬만 대시보드를 연다 — http://localhost:8761 (사용자 eureka, 비밀번호는 backend/.env 의 EUREKA_PASSWORD)
    enabled: true
