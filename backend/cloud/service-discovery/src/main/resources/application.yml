server:
  port: 8761

spring:
  application:
    name: service-discovery
  cloud:
    # Eureka 서버는 다른 서비스를 호출하지 않는다. eureka-server 가 끌고 오는 LoadBalancer 를 꺼서
    # 쓰지도 않는 캐시의 "Caffeine 을 쓰라" WARN 을 남기지 않는다
    loadbalancer:
      enabled: false

eureka:
  instance:
    hostname: localhost
  client:
    # 단독 모드 — 자기 자신을 등록하지 않고, 다른 Eureka 에서 레지스트리를 받아 오지 않는다
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  # self-preservation 은 기본값(켜짐)을 둔다. 로컬에서만 끈다 (application-local.yml).

management:
  endpoints:
    web:
      exposure:
        include: health
